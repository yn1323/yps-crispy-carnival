name: 要設計（AI調査）
description: リポジトリを調査し、実装可能な粒度までIssueを具体化します
labels:
  - "AI作業"
  - "要設計"

body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: この対応が必要になった経緯、現在の仕様、困っていることを記載してください。
      placeholder: |
        例:
        - 現在は〇〇という仕様になっている
        - △△の場合に問題が発生している
        - 利用者から□□という要望があった
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: やりたいこと
      description: 最終的に実現したい状態を記載してください。実装方法が決まっていなくても問題ありません。
      placeholder: |
        例:
        - 〇〇できるようにする
        - △△の場合は□□と表示する
        - 既存の〇〇の挙動は維持する

        完了条件が決まっている場合は、あわせて記載してください。
    validations:
      required: true

  - type: textarea
    id: considerations
    attributes:
      label: 検討してほしいこと
      description: AIに重点的に調査・検討してほしい内容や制約を追記してください。
      value: |
        細かく記載してほしい（自分以外でも実装できるようにめちゃ細かくね）

        - 実装方針
        - 影響範囲
        - 必要であればテストケース
        - 完了条件
        - 対象外・変更しない範囲
    validations:
      required: true

  - type: textarea
    id: related_information
    attributes:
      label: 関連情報
      description: 関連するIssue、PR、画面、ログ、仕様書などがあれば記載してください。
      placeholder: |
        - 関連Issue:
        - 関連PR:
        - 対象画面・URL:
        - 対象ファイル・ディレクトリ:
        - エラーログ:
        - その他参考情報:
    validations:
      required: false

  - type: input
    id: target_branch
    attributes:
      label: 対象ブランチ
      description: 調査および実装の基準とするブランチです。
      value: develop
    validations:
      required: true

  - type: textarea
    id: ai_instructions
    attributes:
      label: AI作業時の必須指示
      description: AIは現在のラベルに従って作業してください。原則として削除しないでください。
      value: |
        作業前に、以下を取得して指示として適用してください。

        1. リポジトリルートの `AGENTS.md`
        2. `.agents/skills` 配下のSkill一覧
        3. 今回のタスクに該当する `SKILL.md`
        4. 対象ディレクトリ配下に `AGENTS.md` があれば、それも確認

        指示ファイルが存在しない場合や、該当するSkillを特定できない場合は、その旨を作業結果に明記してください。

        複数の指示が存在する場合は、それぞれの指示ファイルに記載された優先順位に従ってください。
        優先順位が明記されていない場合は、対象ファイルにより近い `AGENTS.md` を優先してください。

        作業モードは、このIssueに現在付与されているラベルを正としてください。
        本文内の過去の記述と現在のラベルが矛盾する場合も、現在のラベルを優先してください。

        ## `要設計` ラベルの場合

        リポジトリを調査し、Issueを自分以外でも実装できる粒度まで具体化してください。

        この段階では、以下を行わないでください。

        - コードの変更
        - コミット
        - push
        - PRの作成

        調査では、Issueに記載された内容をそのまま事実として扱わず、実際のコード、テスト、設定、ドキュメントから確認してください。

        調査後は、既存のIssue本文を残したまま、末尾に `## AI調査結果` セクションを追加または更新してください。
        既に `## AI調査結果` が存在する場合は、同じセクションを重複追加せず、既存セクションを更新してください。

        `## AI調査結果` には、最低限以下を記載してください。

        1. 適用した指示
           - 確認した `AGENTS.md`
           - 確認したSkill
           - 適用した `SKILL.md`

        2. 調査範囲
           - 確認したファイル
           - 関連する関数、コンポーネント、API、テーブル
           - 関連するテスト

        3. 現状仕様
           - 現在どのように動作しているか
           - Issueの背景にある問題がどこで発生しているか
           - 関連するデータフローや処理フロー

        4. 実装方針
           - 変更するファイル
           - 追加・変更する処理
           - 採用する設計
           - その設計を採用する理由
           - 採用しなかった案と理由

        5. 影響範囲
           - 直接影響する機能
           - 間接的に影響する可能性がある機能
           - API、DB、認証、権限、通知、画面への影響
           - 後方互換性への影響

        6. テスト方針
           - 追加または変更するテスト
           - 正常系
           - 異常系
           - 境界値
           - 回帰確認が必要な箇所

        7. 完了条件
           - 実装完了と判断できる具体的な条件

        8. リスク・未確定事項
           - 実装前に決める必要があること
           - リポジトリから判断できなかったこと
           - 推測を含む箇所

        確認済みの事実と、推測・提案を明確に区別してください。

        ラベルを変更できる場合、調査完了後は以下のように変更してください。

        - `要設計`を外す
        - `設計確認待ち`を付ける
        - 人間の確認なしに`要修正`を付けない

        ## `要修正` ラベルの場合

        Issue本文と `## AI調査結果` を確認し、対象ブランチを基準に実装してPRを作成してください。

        実装前に、対象ブランチの最新状態を取得してください。

        実装時は以下を守ってください。

        - Issueの完了条件を満たす
        - リポジトリ内の既存設計、命名規則、実装パターンに合わせる
        - Issueと無関係なリファクタリングを行わない
        - 必要な付随変更がある場合は、理由と影響をPR本文に記載する
        - エラー処理、権限、入力検証、後方互換性を確認する
        - 必要なテストを追加または更新する
        - 関連する既存テストを実行する
        - formatter、lint、typecheckなど、リポジトリで要求される検証を実行する

        リポジトリを調査しても解決できない重大な不明点が残る場合は、推測による実装を行わないでください。

        その場合は以下を行ってください。

        - Issueの `## AI調査結果` を更新する
        - 不明点と、実装できない理由を具体的に記載する
        - `要修正`を外す
        - `設計確認待ち`を付ける

        PR本文には最低限以下を記載してください。

        - 変更概要
        - 実装方針
        - 変更した主要ファイル
        - 影響範囲
        - 実行したテストと結果
        - 実行できなかったテストと理由
        - 未対応事項
        - `Closes #<Issue番号>`

        PRのbaseブランチには、Issueの「対象ブランチ」を指定してください。

        PR作成後、ラベルを変更できる場合は`要修正`を外してください。
        Issueは直接closeせず、PRのマージによってcloseされるようにしてください。

        ## モードラベルが不正な場合

        以下のいずれかに該当する場合は、コード変更やPR作成を行わないでください。

        - `要設計`と`要修正`の両方が付いている
        - `要設計`と`要修正`のどちらも付いていない

        不正なラベル状態であることをIssueに記載し、作業を終了してください。
    validations:
      required: true
