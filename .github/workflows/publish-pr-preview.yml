name: Publish Trusted PR Preview

on:
  workflow_run:
    workflows: ["PR Preview Artifact"]
    types: [completed]

concurrency:
  group: pr-preview-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  E2E_REPORT_DIR: yps-crispy-carnival-e2e

jobs:
  publish:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    outputs:
      pull_number: ${{ steps.source.outputs.pull_number }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      source_run_attempt: ${{ steps.source.outputs.source_run_attempt }}
      preview_url: ${{ steps.source.outputs.preview_url }}
      report_url: ${{ steps.source.outputs.report_url }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Validate source workflow metadata
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0
            ) {
              core.setFailed('Unexpected PR preview source workflow metadata.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) {
              core.setFailed('PR preview source head SHA is invalid.');
              return;
            }
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('PR preview publishing is limited to same-repository branches.');
              return;
            }

            const pull = run.pull_requests?.[0];
            if (!pull || run.pull_requests.length !== 1) {
              core.setFailed('Exactly one pull request must be associated with the preview artifact.');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
            });
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== run.head_sha ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('PR preview source is stale or targets an unexpected repository boundary.');
              return;
            }

            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: 'pull_request',
              head_sha: run.head_sha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === run.head_sha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                candidate.pull_requests?.some((candidatePull) => candidatePull.number === pull.number),
              )
              .reduce(
                (latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest,
                undefined,
              );
            if (
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success' ||
              liveRun.run_attempt !== run.run_attempt ||
              liveRun.head_sha !== run.head_sha ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== run.run_attempt
            ) {
              core.setFailed('PR preview source run is stale or was superseded.');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            if (
              available.length !== 1 ||
              available[0].name !== 'pr-preview-dist' ||
              available[0].size_in_bytes <= 0 ||
              available[0].size_in_bytes > 300 * 1024 * 1024
            ) {
              core.setFailed('PR preview artifact set or declared size is invalid.');
              return;
            }

            core.setOutput('pull_number', String(pull.number));
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('source_run_attempt', String(run.run_attempt));
            core.setOutput('preview_url', `https://pr-${pull.number}.dev-yps-crispy-carnival.pages.dev`);
            core.setOutput(
              'report_url',
              `https://yn1323.github.io/hosting-pages/${process.env.E2E_REPORT_DIR}/pr-${pull.number}/`,
            );

      - name: Checkout trusted publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted publisher
        uses: ./.github/actions/setup
      - name: Download preview data artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-preview-dist
          path: trusted-artifacts/preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate preview data artifact
        run: node scripts/assertStaticArtifactSafety.mjs --profile preview-dist --root trusted-artifacts/preview-dist
      - name: Scan preview data artifact
        run: node scripts/assertNoSensitiveArtifacts.mjs --root trusted-artifacts/preview-dist
      - name: Revalidate preview source immediately before publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ steps.source.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER);
            const expectedRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              run.head_sha !== expectedHeadSha ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              !Number.isSafeInteger(pullNumber) ||
              pullNumber <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber
            ) {
              core.setFailed('PR preview source identity changed before publication.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('PR preview source is no longer the current open pull request head.');
              return;
            }

            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
            if (
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success' ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt
            ) {
              core.setFailed('PR preview source run was superseded before publication.');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            if (
              available.length !== 1 ||
              available[0].name !== 'pr-preview-dist' ||
              available[0].size_in_bytes <= 0 ||
              available[0].size_in_bytes > 300 * 1024 * 1024
            ) {
              core.setFailed('PR preview artifact changed before publication.');
            }
      - name: Publish static preview data
        id: deploy
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT=$(npx wrangler pages deploy trusted-artifacts/preview-dist \
            --project-name dev-yps-crispy-carnival \
            --branch "pr-${{ steps.source.outputs.pull_number }}" \
            --commit-hash "${{ steps.source.outputs.head_sha }}" \
            --no-bundle 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" \
            | grep -oE 'https://[A-Za-z0-9-]+\.dev-yps-crispy-carnival\.pages\.dev' \
            | tail -1)
          if ! [[ "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9-]+\.dev-yps-crispy-carnival\.pages\.dev$ ]]; then
            echo "::error::Cloudflare deployment URL could not be validated."
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment PR with published preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ steps.source.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '## 🚀 Preview Deploy';
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const issueNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== expectedRepository ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== issueNumber ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              !Number.isSafeInteger(issueNumber) ||
              issueNumber <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0
            ) {
              core.setFailed('Published preview comment source metadata is invalid.');
              return;
            }

            const loadCurrentSource = async () => {
              const [{ data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
                github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: run.workflow_id,
                  event: 'pull_request',
                  head_sha: expectedHeadSha,
                  per_page: 100,
                }),
              ]);
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === 'pull_request' &&
                  candidate.head_sha === expectedHeadSha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === issueNumber),
                )
                .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
              return { pullRequest, liveRun, latestSourceRun };
            };
            const isCurrentSource = ({ pullRequest, liveRun, latestSourceRun }) =>
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'develop' &&
              pullRequest.head.sha === expectedHeadSha &&
              pullRequest.head.repo?.full_name === expectedRepository &&
              liveRun.status === 'completed' &&
              liveRun.conclusion === 'success' &&
              liveRun.head_sha === expectedHeadSha &&
              liveRun.run_attempt === expectedRunAttempt &&
              latestSourceRun?.id === run.id &&
              latestSourceRun.run_attempt === expectedRunAttempt;

            if (!isCurrentSource(await loadCurrentSource())) {
              core.setFailed('Published preview source became stale after deployment.');
              return;
            }

            const previewUrl = `https://pr-${issueNumber}.dev-yps-crispy-carnival.pages.dev`;
            const body = [
              marker,
              '',
              'Status: Passed',
              `**App:** ${previewUrl}`,
              `**Actions:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            if (!isCurrentSource(await loadCurrentSource())) {
              core.setFailed('Published preview source changed before comment write.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

  pr-e2e:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.pr-e2e.outcome }}
      result_artifact_uploaded: ${{ steps.pr-e2e-result-artifact.outcome == 'success' }}
    steps:
      - name: Checkout trusted PR E2E code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted PR E2E code
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Wait for exact PR Preview deployment
        env:
          E2E_DEPLOYED_BASE_URL: ${{ needs.publish.outputs.deployment_url }}
        run: |
          set -euo pipefail
          if ! [[ "$E2E_DEPLOYED_BASE_URL" =~ ^https://[A-Za-z0-9-]+\.dev-yps-crispy-carnival\.pages\.dev$ ]]; then
            echo "::error::PR E2E target URL is outside the trusted Cloudflare project."
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null "$E2E_DEPLOYED_BASE_URL/"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Exact PR Preview deployment did not become ready within 150 seconds."
          exit 1
      - name: Run credential-free PR E2E Smoke
        id: pr-e2e
        continue-on-error: true
        run: pnpm e2e:deployed
        env:
          E2E_DEPLOYED_BASE_URL: ${{ needs.publish.outputs.deployment_url }}
      - name: Prepare PR E2E result data
        if: ${{ always() && hashFiles('test-results-deployed.json') != '' }}
        run: |
          mkdir -p pr-e2e-result
          mv test-results-deployed.json pr-e2e-result/test-results-deployed.json
      - name: Validate PR E2E result data
        id: pr-e2e-result-safety
        if: ${{ always() && hashFiles('pr-e2e-result/test-results-deployed.json') != '' }}
        run: |
          node scripts/assertStaticArtifactSafety.mjs \
            --profile playwright-result \
            --root pr-e2e-result
          node scripts/assertNoSensitiveArtifacts.mjs --root pr-e2e-result
      - name: Upload PR E2E result data
        id: pr-e2e-result-artifact
        if: ${{ always() && steps.pr-e2e-result-safety.outcome == 'success' && hashFiles('pr-e2e-result/test-results-deployed.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-e2e-result
          path: pr-e2e-result/
          if-no-files-found: error
          retention-days: 1
      - name: Assert PR E2E Smoke result
        if: ${{ always() }}
        env:
          PR_E2E_OUTCOME: ${{ steps.pr-e2e.outcome }}
          RESULT_SAFETY_OUTCOME: ${{ steps.pr-e2e-result-safety.outcome }}
          RESULT_ARTIFACT_OUTCOME: ${{ steps.pr-e2e-result-artifact.outcome }}
        run: |
          if [ "$PR_E2E_OUTCOME" != "success" ] || \
             [ "$RESULT_SAFETY_OUTCOME" != "success" ] || \
             [ "$RESULT_ARTIFACT_OUTCOME" != "success" ]; then
            echo "::error::PR E2E Smoke or its result artifact failed."
            exit 1
          fi

  comment-pr-e2e-status:
    needs: [publish, pr-e2e]
    if: |
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR with preliminary E2E result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_E2E_JOB_RESULT: ${{ needs.pr-e2e.result }}
          PR_E2E_RESULT: ${{ needs.pr-e2e.outputs.test_outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-playwright-report:v1 -->';
            const heading = '## Playwright Test Report';
            const otherMarker = '<!-- shiftori-vrt-report:v1 -->';
            const otherHeading = '## VRT Report';
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1 ||
              !Number.isSafeInteger(run.pull_requests[0]?.number) ||
              run.pull_requests[0].number <= 0
            ) {
              core.setFailed('PR E2E status comment source metadata is invalid.');
              return;
            }

            const issueNumber = run.pull_requests[0].number;
            const loadCurrentSource = async () => {
              const [{ data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
                github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: run.workflow_id,
                  event: 'pull_request',
                  head_sha: run.head_sha,
                  per_page: 100,
                }),
              ]);
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === 'pull_request' &&
                  candidate.head_sha === run.head_sha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === issueNumber),
                )
                .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
              return { pullRequest, liveRun, latestSourceRun };
            };

            const isCurrentSource = ({ pullRequest, liveRun, latestSourceRun }) =>
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'develop' &&
              pullRequest.head.sha === run.head_sha &&
              pullRequest.head.repo?.full_name === expectedRepository &&
              liveRun.name === run.name &&
              liveRun.workflow_id === run.workflow_id &&
              liveRun.event === 'pull_request' &&
              liveRun.status === 'completed' &&
              liveRun.conclusion === run.conclusion &&
              liveRun.head_sha === run.head_sha &&
              liveRun.run_attempt === run.run_attempt &&
              latestSourceRun?.id === run.id &&
              latestSourceRun.run_attempt === run.run_attempt;

            if (!isCurrentSource(await loadCurrentSource())) {
              core.notice('Skip stale preliminary PR E2E comment update.');
              return;
            }

            const previewPublishResult = process.env.PREVIEW_PUBLISH_RESULT ?? '';
            const prE2EJobResult = process.env.PR_E2E_JOB_RESULT ?? '';
            const prE2EResult = process.env.PR_E2E_RESULT ?? '';
            let status;
            let phase;
            if (run.conclusion !== 'success') {
              status = `Failed (Preview artifact ${run.conclusion ?? 'unknown'})`;
              phase = 'source-failed';
            } else if (previewPublishResult !== 'success') {
              status = `Failed (Preview publish ${previewPublishResult || 'unknown'})`;
              phase = 'preview-failed';
            } else if (prE2EJobResult !== 'success' || prE2EResult !== 'success') {
              status = `Failed (PR E2E ${prE2EJobResult !== 'success' ? prE2EJobResult || 'not-run' : prE2EResult})`;
              phase = 'e2e-failed';
            } else {
              status = 'Passed (hosting-pages publish pending)';
              phase = 'report-pending';
            }

            const plannedReportUrl = `https://yn1323.github.io/hosting-pages/${process.env.E2E_REPORT_DIR}/pr-${issueNumber}/`;
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const previewUrl = `https://pr-${issueNumber}.dev-yps-crispy-carnival.pages.dev`;
            const stateMarker = `<!-- shiftori-playwright-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const smokeDetail = ['success', 'failure'].includes(prE2EResult)
              ? `開いているPRのcommit \`${run.head_sha}\` に対して、認証情報を使わない公開5ルートのSmokeを実行しました。`
              : `開いているPRのcommit \`${run.head_sha}\` に対する公開5ルートのSmokeは完了していません。`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              '',
              '| Action | Link |',
              '|---|---|',
              `| レポート確認 | [hosting-pagesの予定URLを開く（未公開の場合あり）](${plannedReportUrl}) |`,
              `| 実行結果 | [PR E2E実行・公開承認を見る](${actionsUrl}) |`,
              `| テスト対象 | [PR Previewを開く](${previewUrl}) |`,
              '',
              'Details:',
              smokeDetail,
              phase === 'report-pending'
                ? 'hosting-pagesへの公開完了後、このコメントを公開済みレポートへ更新します。'
                : 'Actionsで失敗した工程を確認してください。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const botComments = [...comments].reverse().filter(
              (comment) => comment.user?.login === 'github-actions[bot]',
            );
            const markedComment = botComments.find((comment) => comment.body?.includes(marker));
            const actionsPrefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            const legacyCandidates = botComments.filter((comment) => {
              const commentBody = comment.body?.trimStart() ?? '';
              return commentBody.startsWith(`${heading}\n`) &&
                commentBody.includes('\nStatus: ') &&
                commentBody.includes('\n| Action | Link |\n') &&
                commentBody.includes(actionsPrefix) &&
                !commentBody.includes(otherMarker) &&
                !commentBody.includes(otherHeading);
            });
            const existing = markedComment ?? (legacyCandidates.length === 1 ? legacyCandidates[0] : undefined);

            if (!isCurrentSource(await loadCurrentSource())) {
              core.notice('Skip preliminary PR E2E comment because the source changed before write.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

  publish-pr-e2e-report:
    needs: [publish, pr-e2e, comment-pr-e2e-status]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      needs.pr-e2e.outputs.result_artifact_uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      report_deployed: ${{ steps.wait-e2e-report-deploy.outputs.deploy_status == 'success' }}
    steps:
      - name: Validate PR E2E publication source
        id: publication-source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.publish.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.publish.outputs.source_run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              run.head_sha !== expectedHeadSha ||
              !Number.isSafeInteger(pullNumber) ||
              pullNumber <= 0 ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              run.run_attempt !== expectedRunAttempt
            ) {
              core.setFailed('PR E2E publication source identity is invalid.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success' ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt
            ) {
              core.setFailed('PR E2E publication source is stale or was superseded.');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            if (
              available.length !== 1 ||
              available[0].name !== 'pr-e2e-result' ||
              available[0].size_in_bytes <= 0 ||
              available[0].size_in_bytes > 5 * 1024 * 1024
            ) {
              core.setFailed('PR E2E result artifact set or declared size is invalid.');
            }
      - name: Checkout trusted PR E2E report publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted PR E2E report publisher
        uses: ./.github/actions/setup
      - name: Download PR E2E result data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-e2e-result
          path: trusted-artifacts/pr-e2e-result
      - name: Validate PR E2E result data
        run: |
          node scripts/assertStaticArtifactSafety.mjs \
            --profile playwright-result \
            --root trusted-artifacts/pr-e2e-result
          node scripts/assertNoSensitiveArtifacts.mjs --root trusted-artifacts/pr-e2e-result
      - name: Build trusted public PR E2E report
        env:
          PR_E2E_OUTCOME: ${{ needs.pr-e2e.outputs.test_outcome }}
          PULL_NUMBER: ${{ needs.publish.outputs.pull_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          PUBLISH_RUN_ID: ${{ github.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_URL: ${{ needs.publish.outputs.deployment_url }}
        run: |
          node scripts/buildPublicPlaywrightReport.mjs \
            --input trusted-artifacts/pr-e2e-result/test-results-deployed.json \
            --output playwright-public-report \
            --result "$PR_E2E_OUTCOME" \
            --pull-number "$PULL_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --source-run-id "$PUBLISH_RUN_ID" \
            --source-run-attempt "$PUBLISH_RUN_ATTEMPT" \
            --actions-url "$ACTIONS_URL" \
            --preview-url "$PREVIEW_URL"
      - name: Validate trusted public PR E2E report
        run: |
          node scripts/assertStaticArtifactSafety.mjs \
            --profile playwright-public-report \
            --root playwright-public-report
          node scripts/assertNoSensitiveArtifacts.mjs --root playwright-public-report
      - name: Revalidate PR E2E source immediately before credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.publish.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.publish.outputs.source_run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === 'PR Preview Artifact' &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success' ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              available.length !== 1 ||
              available[0].name !== 'pr-e2e-result' ||
              available[0].size_in_bytes <= 0 ||
              available[0].size_in_bytes > 5 * 1024 * 1024
            ) {
              core.setFailed('PR E2E source changed before publication credentials were enabled.');
            }
      - name: Checkout E2E hosting pages after validation
        run: |
          git clone --depth 1 --single-branch \
            https://x-access-token:${{ secrets.HOSTING_PAGES_TOKEN }}@github.com/yn1323/hosting-pages.git \
            hosting-pages
      - name: Revalidate PR E2E source immediately before publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.publish.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.publish.outputs.source_run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: 'pull_request',
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === 'PR Preview Artifact' &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success' ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('PR E2E source changed immediately before report publication.');
            }
      - name: Publish trusted PR E2E report
        env:
          REPORT_KEY: pr-${{ needs.publish.outputs.pull_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REPORT_KEY" =~ ^pr-[1-9][0-9]*$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected PR E2E report target."
            exit 1
          fi
          REPORT_TARGET="hosting-pages/${E2E_REPORT_DIR}/${REPORT_KEY}"
          rm -rf "$REPORT_TARGET"
          mkdir -p "$REPORT_TARGET"
          cp -R playwright-public-report/. "$REPORT_TARGET/"
          echo "${{ github.run_id }}-${{ github.run_attempt }}" > "$REPORT_TARGET/deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"

          cd hosting-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${E2E_REPORT_DIR}/${REPORT_KEY}"
          git commit -m "PR E2E report for ${REPORT_KEY} at ${HEAD_SHA}"
          bash "$GITHUB_WORKSPACE/scripts/pushHostingPagesWithRetry.sh"
      - name: Wait for trusted PR E2E report deploy
        id: wait-e2e-report-deploy
        env:
          REPORT_URL: ${{ needs.publish.outputs.report_url }}
        run: |
          set -euo pipefail
          MARKER_URL="${REPORT_URL}deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --output /dev/null "${MARKER_URL}?t=$(date +%s)"; then
              echo "deploy_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Trusted PR E2E report deploy could not be confirmed within 15 minutes."
          exit 1

  comment-pr-e2e-result:
    needs: [publish, pr-e2e, comment-pr-e2e-status, publish-pr-e2e-report]
    if: |
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR with trusted E2E result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_E2E_JOB_RESULT: ${{ needs.pr-e2e.result }}
          PR_E2E_RESULT: ${{ needs.pr-e2e.outputs.test_outcome }}
          REPORT_PUBLISH_RESULT: ${{ needs.publish-pr-e2e-report.result }}
          REPORT_DEPLOYED: ${{ needs.publish-pr-e2e-report.outputs.report_deployed }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-playwright-report:v1 -->';
            const heading = '## Playwright Test Report';
            const otherMarker = '<!-- shiftori-vrt-report:v1 -->';
            const otherHeading = '## VRT Report';
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (
              run.name !== 'PR Preview Artifact' ||
              run.event !== 'pull_request' ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1 ||
              !Number.isSafeInteger(run.pull_requests[0]?.number) ||
              run.pull_requests[0].number <= 0
            ) {
              core.setFailed('PR E2E comment source metadata is invalid.');
              return;
            }

            const issueNumber = run.pull_requests[0].number;
            const loadCurrentSource = async () => {
              const [{ data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
                github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: run.workflow_id,
                  event: 'pull_request',
                  head_sha: run.head_sha,
                  per_page: 100,
                }),
              ]);
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === 'pull_request' &&
                  candidate.head_sha === run.head_sha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === issueNumber),
                )
                .reduce((latest, candidate) => !latest || candidate.id > latest.id ? candidate : latest, undefined);
              return { pullRequest, liveRun, latestSourceRun };
            };

            const isCurrentSource = ({ pullRequest, liveRun, latestSourceRun }) =>
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'develop' &&
              pullRequest.head.sha === run.head_sha &&
              pullRequest.head.repo?.full_name === expectedRepository &&
              liveRun.name === run.name &&
              liveRun.workflow_id === run.workflow_id &&
              liveRun.event === 'pull_request' &&
              liveRun.status === 'completed' &&
              liveRun.conclusion === run.conclusion &&
              liveRun.head_sha === run.head_sha &&
              liveRun.run_attempt === run.run_attempt &&
              latestSourceRun?.id === run.id &&
              latestSourceRun.run_attempt === run.run_attempt;

            const currentSource = await loadCurrentSource();
            if (!isCurrentSource(currentSource)) {
              core.notice('Skip stale PR E2E comment update.');
              return;
            }

            const previewPublishResult = process.env.PREVIEW_PUBLISH_RESULT ?? '';
            const prE2EJobResult = process.env.PR_E2E_JOB_RESULT ?? '';
            const prE2EResult = process.env.PR_E2E_RESULT ?? '';
            const reportPublishResult = process.env.REPORT_PUBLISH_RESULT ?? '';
            const reportDeployed = process.env.REPORT_DEPLOYED === 'true';
            const publishRunAttempt = Number(process.env.PUBLISH_RUN_ATTEMPT ?? '');
            if (!Number.isSafeInteger(publishRunAttempt) || publishRunAttempt <= 0) {
              core.setFailed('PR E2E publisher run attempt is invalid.');
              return;
            }

            let status;
            let phase;
            if (run.conclusion !== 'success') {
              status = `Failed (Preview artifact ${run.conclusion ?? 'unknown'})`;
              phase = 'source-failed';
            } else if (previewPublishResult !== 'success') {
              status = `Failed (Preview publish ${previewPublishResult || 'unknown'})`;
              phase = 'preview-failed';
            } else if (prE2EJobResult !== 'success' || prE2EResult !== 'success') {
              status = `Failed (PR E2E ${prE2EJobResult !== 'success' ? prE2EJobResult || 'not-run' : prE2EResult})`;
              phase = 'e2e-failed';
            } else if (reportPublishResult !== 'success' || !reportDeployed) {
              status = `Failed (report publish ${reportPublishResult || 'unknown'})`;
              phase = 'report-failed';
            } else {
              status = 'Passed';
              phase = 'published';
            }

            const plannedReportUrl = `https://yn1323.github.io/hosting-pages/${process.env.E2E_REPORT_DIR}/pr-${issueNumber}/`;
            const reportUrl = reportDeployed && reportPublishResult === 'success'
              ? `${plannedReportUrl}?v=${context.runId}-${publishRunAttempt}`
              : plannedReportUrl;
            const reportLabel = reportDeployed && reportPublishResult === 'success'
              ? 'hosting-pagesでE2Eレポートを見る'
              : 'hosting-pagesの予定URLを開く（未公開の場合あり）';
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const previewUrl = `https://pr-${issueNumber}.dev-yps-crispy-carnival.pages.dev`;
            const stateMarker = `<!-- shiftori-playwright-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const smokeDetail = ['success', 'failure'].includes(prE2EResult)
              ? `開いているPRのcommit \`${run.head_sha}\` に対して、認証情報を使わない公開5ルートのSmokeを実行しました。`
              : `開いているPRのcommit \`${run.head_sha}\` に対する公開5ルートのSmokeは完了していません。`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              '',
              '| Action | Link |',
              '|---|---|',
              `| レポート確認 | [${reportLabel}](${reportUrl}) |`,
              `| 実行結果 | [PR E2E実行を見る](${actionsUrl}) |`,
              `| テスト対象 | [PR Previewを開く](${previewUrl}) |`,
              '',
              'Details:',
              smokeDetail,
              '認証付きFull Regressionはdevelopへマージされたexact commitで別途実行します。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const botComments = [...comments].reverse().filter(
              (comment) => comment.user?.login === 'github-actions[bot]',
            );
            const markedComment = botComments.find((comment) => comment.body?.includes(marker));
            const actionsPrefix = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/`;
            const legacyCandidates = botComments.filter((comment) => {
              const commentBody = comment.body?.trimStart() ?? '';
              return commentBody.startsWith(`${heading}\n`) &&
                commentBody.includes('\nStatus: ') &&
                commentBody.includes('\n| Action | Link |\n') &&
                commentBody.includes(actionsPrefix) &&
                !commentBody.includes(otherMarker) &&
                !commentBody.includes(otherHeading);
            });
            const existing = markedComment ?? (legacyCandidates.length === 1 ? legacyCandidates[0] : undefined);

            const currentBeforeWrite = await loadCurrentSource();
            if (!isCurrentSource(currentBeforeWrite)) {
              core.notice('Skip PR E2E comment because the source changed before write.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
