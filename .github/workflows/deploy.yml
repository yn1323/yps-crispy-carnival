name: Deploy to Cloudflare Pages

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    environment: Preview
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CONVEX_PREVIEW_NAME: pr-${{ github.event.pull_request.number }}-deploy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Delete previous Preview Deploy comments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '## 🚀 Preview Deploy';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }
      - name: Setup
        uses: ./.github/actions/setup
      - name: Deploy Convex Preview
        id: convex
        run: |
          deploy_preview() {
            local preview_option="$1"
            npx convex deploy "$preview_option" "$CONVEX_PREVIEW_NAME" \
              --cmd 'echo "PREVIEW_URL=$CONVEX_URL" >> "$GITHUB_OUTPUT"' \
              --cmd-url-env-var-name CONVEX_URL
          }

          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT

          set +e
          deploy_preview --preview-create 2>&1 | tee "$deploy_log"
          deploy_status="${PIPESTATUS[0]}"
          set -e

          if [[ "$deploy_status" -eq 0 ]]; then
            exit 0
          fi

          if ! grep -Fq "/api/deploy2/start_push 408 Request Timeout" "$deploy_log"; then
            exit "$deploy_status"
          fi

          echo "::warning::Convex preview creation timed out; retrying the claimed preview once"
          deploy_preview --preview-name
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # NOTE: convex-seeds/seeds/db.zip is currently stale against the schema.
      # Re-enable this only after regenerating the seed snapshot.
      # - name: Seed Database
      #   run: |
      #     npx convex import --replace-all convex-seeds/seeds/db.zip --yes \
      #       --preview-name "${{ env.CONVEX_PREVIEW_NAME }}"
      #   env:
      #     CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Build
        run: pnpm build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_STANDARD_PRICE_ID: ${{ secrets.STRIPE_STANDARD_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          VITE_APP_ENVIRONMENT: preview
          VITE_CONVEX_URL: ${{ steps.convex.outputs.PREVIEW_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_RELEASE_ID: ${{ github.event.pull_request.head.sha }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_WEB_MEASUREMENT_ENABLED: ${{ vars.VITE_WEB_MEASUREMENT_ENABLED }}
          VITE_WEB_VITALS_SAMPLE_RATE: ${{ vars.VITE_WEB_VITALS_SAMPLE_RATE }}
          VITE_COMMERCIAL_TRANSACTIONS_ADDRESS: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_ADDRESS }}
          VITE_COMMERCIAL_TRANSACTIONS_NAME: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_NAME }}
          VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx wrangler pages deploy dist/client \
            --project-name dev-yps-crispy-carnival \
            --branch "pr-${{ github.event.pull_request.number }}" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment PR with Deploy URL
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.DEPLOY_URL }}';
            const convexUrl = '${{ steps.convex.outputs.PREVIEW_URL }}';
            const marker = '## 🚀 Preview Deploy';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}\n\n**App:** ${deployUrl}\n**Convex:** ${convexUrl}`
            });
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Verify deployed static site
        run: pnpm smoke-test:deployed
        env:
          E2E_DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.DEPLOY_URL }}
      # 通常Previewのdeployとnegative smoke後にだけ、外部公開しないsynthetic buildへlocal distを置き換える。
      - name: Build measurement-enabled browser contract
        run: pnpm build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_STANDARD_PRICE_ID: ${{ secrets.STRIPE_STANDARD_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          VITE_APP_ENVIRONMENT: preview
          VITE_CONVEX_URL: ${{ steps.convex.outputs.PREVIEW_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GTM_ID: GTM-TEST1234
          VITE_RELEASE_ID: measurement-contract
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_WEB_MEASUREMENT_ENABLED: "true"
          VITE_WEB_VITALS_SAMPLE_RATE: "0"
      - name: Verify measurement-enabled browser contract
        run: pnpm test:e2e:measurement
        env:
          # Playwright webServerはこのCI専用phaseだけでproduction buildを起動する。
          E2E_MEASUREMENT_BASE_URL: http://127.0.0.1:4174
          E2E_MEASUREMENT_START_SERVER: "true"

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Delete Cloudflare Pages preview
        run: |
          DEPLOYMENTS=$(curl -s \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dev-yps-crispy-carnival/deployments" \
            | jq -r ".result[] | select(.deployment_trigger.metadata.branch == \"pr-${{ github.event.pull_request.number }}\") | .id")
          for ID in $DEPLOYMENTS; do
            echo "Deleting deployment $ID"
            curl -s -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dev-yps-crispy-carnival/deployments/$ID?force=true"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Delete Convex previews
        if: ${{ github.event.pull_request.merged == true }}
        run: |
          pnpm exec tsx scripts/deleteConvexPreviews.ts \
            --project-slug dev-yps-crispy-carnival \
            --names "pr-${{ github.event.pull_request.number }}-deploy,pr-${{ github.event.pull_request.number }}-e2e"
        env:
          CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}

  deploy-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Develop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup
        uses: ./.github/actions/setup
      # Stripeを含む公開artifactのBuildを先に完了し、失敗時はdeploymentを変更しない。
      - name: Build
        run: pnpm build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_STANDARD_PRICE_ID: ${{ secrets.STRIPE_STANDARD_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          VITE_APP_ENVIRONMENT: develop
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_RELEASE_ID: ${{ github.sha }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_WEB_MEASUREMENT_ENABLED: ${{ vars.VITE_WEB_MEASUREMENT_ENABLED }}
          VITE_WEB_VITALS_SAMPLE_RATE: ${{ vars.VITE_WEB_VITALS_SAMPLE_RATE }}
          VITE_COMMERCIAL_TRANSACTIONS_ADDRESS: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_ADDRESS }}
          VITE_COMMERCIAL_TRANSACTIONS_NAME: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_NAME }}
          VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER }}
      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Run Convex migrations
        run: npx convex run migrations/index:run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist/client \
            --project-name dev-yps-crispy-carnival
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
