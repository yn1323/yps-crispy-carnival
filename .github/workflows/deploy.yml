name: Deploy Develop

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-develop-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-develop:
    runs-on: ubuntu-latest
    environment: Develop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Run Convex migrations
        run: npx convex run migrations/index:run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Build
        run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Prerender static routes
        run: pnpm prerender
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx wrangler pages deploy dist \
            --project-name dev-yps-crispy-carnival \
            --commit-hash "${{ github.sha }}" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke deployed Cloudflare Develop
        run: pnpm e2e:deployed
        env:
          E2E_DEPLOYED_BASE_URL: ${{ steps.deploy.outputs.DEPLOY_URL }}
