name: Full Regression on Develop

on:
  push:
    branches: [develop]

concurrency:
  group: playwright-develop-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: Preview
    outputs:
      report_artifact_uploaded: ${{ steps.playwright-report-artifact.outcome == 'success' }}
    env:
      CONVEX_PREVIEW_NAME: develop-${{ github.run_id }}-e2e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Deploy Preview
        id: preview
        run: |
          npx convex deploy --preview-create "$CONVEX_PREVIEW_NAME" \
            --cmd 'echo "PREVIEW_URL=$CONVEX_URL" >> "$GITHUB_OUTPUT"' \
            --cmd-url-env-var-name CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Configure E2E Preview safety
        run: |
          E2E_INVITATION_SIGNING_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$E2E_INVITATION_SIGNING_SECRET"
          npx convex env set E2E_TESTING_DEPLOYMENT_URL "${{ steps.preview.outputs.PREVIEW_URL }}" --deployment "preview/$CONVEX_PREVIEW_NAME"
          npx convex env set E2E_TESTING_ENABLED true --deployment "preview/$CONVEX_PREVIEW_NAME"
          npx convex env set NOTIFICATION_DELIVERY_MODE dry-run --deployment "preview/$CONVEX_PREVIEW_NAME"
          npx convex env set ORGANIZATION_INVITATION_SIGNING_SECRET "$E2E_INVITATION_SIGNING_SECRET" --deployment "preview/$CONVEX_PREVIEW_NAME"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify Preview E2E Safety
        run: |
          SAFETY_STATE=$(npx convex run testing:getE2ESafetyState --deployment "preview/${CONVEX_PREVIEW_NAME}")
          node -e 'const state = JSON.parse(process.argv[1]); if (!state.helpersEnabled || !state.notificationDeliverySuppressed || !state.organizationInvitationSigningSecretConfigured) process.exit(1)' "$SAFETY_STATE"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # NOTE: convex-seeds/seeds/db.zip is currently stale against the schema.
      # E2E scenarios seed their own data via convex/testing.ts helpers.
      # - name: Seed Database
      #   run: |
      #     npx convex import --replace-all convex-seeds/seeds/db.zip --yes \
      #       --preview-name "${{ env.CONVEX_PREVIEW_NAME }}"
      #   env:
      #     CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Run Playwright tests
        id: playwright
        run: |
          node -e 'const escape = (value) => value.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"); const values = [process.env.E2E_CLERK_PASSWORD, ...(process.env.E2E_CLERK_USERS || "").split(",").map((value) => value.trim())]; for (const value of values.filter(Boolean)) console.log(`::add-mask::${escape(value)}`)'
          pnpm e2e:release
        env:
          TZ: Asia/Tokyo
          VITE_CONVEX_URL: ${{ steps.preview.outputs.PREVIEW_URL }}
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          E2E_CLERK_USERS: ${{ vars.E2E_CLERK_USERS }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD || vars.E2E_CLERK_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TESTING_ENABLED: "true"
          NOTIFICATION_DELIVERY_MODE: dry-run
      - name: Verify Playwright artifact safety
        id: artifact-safety
        if: ${{ !cancelled() }}
        run: |
          pnpm e2e:assert-artifact-safety
          node scripts/assertNoSensitiveArtifacts.mjs \
            --root test-results.json \
            --root playwright-report \
            --root test-results
        env:
          E2E_CLERK_USERS: ${{ vars.E2E_CLERK_USERS }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD || vars.E2E_CLERK_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify Full Regression result gate
        id: result-gate
        run: pnpm e2e:assert-release-results
      - name: Verify Full Regression backend audit
        id: backend-audit
        run: |
          BACKEND_AUDIT_ARGS=$(node -e 'const emails = (process.env.E2E_CLERK_USERS || "").split(",").map((email) => email.trim()).filter(Boolean); process.stdout.write(JSON.stringify({ managerEmails: emails }));')
          BACKEND_AUDIT=$(npx convex run testing:getE2EBackendAudit "$BACKEND_AUDIT_ARGS" --deployment "preview/${CONVEX_PREVIEW_NAME}")
          node -e 'const audit = JSON.parse(process.argv[1]); if (audit.requestedManagerEmailCount === 0 || audit.missingManagerEmailCount !== 0 || audit.managerEmailWithoutShopCount !== 0 || audit.auditedShopCount === 0 || audit.auditedOrganizationCount === 0 || audit.unexpectedUnresolvedFailureInboxCount !== 0 || audit.duplicateActiveDedupeKeyCount !== 0) { console.error(audit); process.exit(1); }' "$BACKEND_AUDIT"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_CLERK_USERS: ${{ vars.E2E_CLERK_USERS }}
      - name: Upload Playwright report
        id: playwright-report-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() && steps.artifact-safety.outcome == 'success' }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results.json
            test-results/
          retention-days: 7

  comment:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment merged PR with Full Regression result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_ARTIFACT_UPLOADED: ${{ needs.test.outputs.report_artifact_uploaded }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-playwright-report:v1 -->';
            const heading = '## Playwright Test Report';
            const otherMarker = '<!-- shiftori-vrt-report:v1 -->';
            const otherHeading = '## VRT Report';
            const { owner, repo } = context.repo;
            const expectedRepository = `${owner}/${repo}`;
            const mergeSha = context.sha;
            if (
              context.eventName !== 'push' ||
              context.ref !== 'refs/heads/develop' ||
              context.payload.after !== mergeSha ||
              !/^[0-9a-f]{40}$/.test(mergeSha ?? '')
            ) {
              core.setFailed('Full Regression comment must originate from the exact develop push commit.');
              return;
            }

            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: mergeSha,
                per_page: 100,
              },
            );
            const candidates = associatedPulls.filter((pull) =>
              pull.state === 'closed' &&
              typeof pull.merged_at === 'string' &&
              pull.base?.ref === 'develop' &&
              pull.base?.repo?.full_name === expectedRepository &&
              pull.merge_commit_sha === mergeSha,
            );
            if (candidates.length === 0) {
              core.info(`No merged pull request is associated with develop commit ${mergeSha}.`);
              return;
            }
            if (candidates.length !== 1) {
              core.setFailed(`Expected exactly one merged pull request for develop commit ${mergeSha}.`);
              return;
            }

            const pullNumber = candidates[0].number;
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('Associated pull request number is invalid.');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (
              pullRequest.state !== 'closed' ||
              typeof pullRequest.merged_at !== 'string' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.base.repo?.full_name !== expectedRepository ||
              pullRequest.merge_commit_sha !== mergeSha
            ) {
              core.setFailed('Associated pull request no longer matches the tested develop merge commit.');
              return;
            }

            const result = process.env.TEST_RESULT ?? '';
            if (!['success', 'failure', 'cancelled', 'skipped'].includes(result)) {
              core.setFailed(`Unexpected Full Regression result: ${result || 'missing'}.`);
              return;
            }
            const reportArtifactUploaded = process.env.REPORT_ARTIFACT_UPLOADED === 'true';
            const status = result === 'success' ? 'Passed' : `Failed (${result})`;
            const actionsUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              heading,
              '',
              `Status: ${status}`,
              '',
              '| Action | Link |',
              '|---|---|',
              `| 実行結果 | [Actionsを見る](${actionsUrl}) |`,
              ...(reportArtifactUploaded
                ? [`| レポート確認 | [Actionsの非公開artifactを見る](${actionsUrl}) |`]
                : []),
              '',
              'Details:',
              `developへマージされたcommit \`${mergeSha}\` をFull Regressionで検証しました。`,
              reportArtifactUploaded
                ? 'trace・動画・tokenを含み得るため、レポートはActions artifactだけに保存します。'
                : 'Playwright report artifactは生成されていません。Actionsログで失敗箇所を確認してください。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const botComments = [...comments].reverse().filter(
              (comment) => comment.user?.login === 'github-actions[bot]',
            );
            const markedComment = botComments.find((comment) => comment.body?.includes(marker));
            const actionsPrefix = `${context.serverUrl}/${owner}/${repo}/actions/runs/`;
            const legacyCandidates = botComments.filter((comment) => {
              const body = comment.body?.trimStart() ?? '';
              return body.startsWith(`${heading}\n`) &&
                body.includes('\nStatus: ') &&
                body.includes('\n| Action | Link |\n') &&
                body.includes(actionsPrefix) &&
                !body.includes(otherMarker) &&
                !body.includes(otherHeading);
            });
            const existing = markedComment ?? (legacyCandidates.length === 1 ? legacyCandidates[0] : undefined);
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
