name: Playwright Tests

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    timeout-minutes: 75
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: playwright-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      report_ready: ${{ steps.report_artifact.outcome == 'success' && steps.result_artifact.outcome == 'success' }}
      test_result: ${{ steps.playwright.outcome }}
    env:
      CONVEX_PREVIEW_NAME: pr-${{ github.event.pull_request.number }}-e2e
      E2E_WORKERS: "3"
      PLAYWRIGHT_NO_COPY_PROMPT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Deploy Preview
        id: preview
        run: |
          npx convex deploy --preview-create "$CONVEX_PREVIEW_NAME" \
            --cmd 'echo "PREVIEW_URL=$CONVEX_URL" >> "$GITHUB_OUTPUT"' \
            --cmd-url-env-var-name CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Configure E2E Preview
        id: configure
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          E2E_INVITATION_SIGNING_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$E2E_INVITATION_SIGNING_SECRET"
          npx convex env set DEBUG_MODE true --deployment "preview/$CONVEX_PREVIEW_NAME"
          npx convex env set DEBUG_NOTIFICATION_DELIVERY_MODE dry-run --deployment "preview/$CONVEX_PREVIEW_NAME"
          npx convex env set ORGANIZATION_INVITATION_SIGNING_SECRET "$E2E_INVITATION_SIGNING_SECRET" --deployment "preview/$CONVEX_PREVIEW_NAME"
      # NOTE: convex-seeds/seeds/db.zip is currently stale against the schema.
      # E2E scenarios seed their own data via convex/testing.ts helpers.
      - name: Run Playwright tests
        id: playwright
        run: |
          node -e 'const escape = (value) => value.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"); const values = [process.env.E2E_CLERK_PASSWORD, ...(process.env.E2E_CLERK_USERS || "").split(",").map((value) => value.trim())]; for (const value of values.filter(Boolean)) console.log(`::add-mask::${escape(value)}`)'
          pnpm e2e:ci
        env:
          TZ: Asia/Tokyo
          VITE_CONVEX_URL: ${{ steps.preview.outputs.PREVIEW_URL }}
          CONVEX_PREVIEW_NAME: ${{ env.CONVEX_PREVIEW_NAME }}
          E2E_CLERK_USERS: ${{ secrets.E2E_CLERK_USERS }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify Playwright artifact privacy
        id: privacy
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        env:
          E2E_CLERK_USERS: ${{ secrets.E2E_CLERK_USERS }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD }}
        run: node scripts/assertNoSensitiveArtifacts.mjs --root playwright-report --root test-results.json --root test-results
      - name: Upload complete Playwright report
        id: report_artifact
        if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Playwright result summary
        id: result_artifact
        if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-result-summary-${{ github.run_attempt }}
          path: test-results.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [test]
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.test.outputs.report_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: hosted-reports-r2-write
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout trusted report publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 2f13a69a03ad02983cb0773f0eac8918acfe3d91
          path: trusted-tools
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install trusted report dependencies
        working-directory: trusted-tools
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Download complete Playwright report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: report-input
      - name: Download Playwright result summary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: playwright-result-summary-${{ github.run_attempt }}
          path: result-input
      - name: Prepare public Playwright report
        id: prepare_report
        working-directory: trusted-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.outputs.test_result }}
        run: >-
          node scripts/hostedReportCi.mjs prepare --type playwright
          --source ../report-input --summary ../result-input/test-results.json
          --output ../prepared-report
      - name: Publish Playwright report to R2
        if: steps.prepare_report.outputs.status == 'prepared'
        working-directory: trusted-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_R2_ACCESS_KEY_ID: ${{ secrets.REPORT_R2_ACCESS_KEY_ID }}
          REPORT_R2_SECRET_ACCESS_KEY: ${{ secrets.REPORT_R2_SECRET_ACCESS_KEY }}
          REPORT_R2_ENDPOINT: ${{ vars.REPORT_R2_ENDPOINT }}
          REPORT_R2_PUBLIC_BUCKET: ${{ vars.REPORT_R2_PUBLIC_BUCKET }}
          REPORT_PUBLIC_BASE_URL: ${{ vars.REPORT_PUBLIC_BASE_URL }}
        run: node scripts/hostedReportCi.mjs publish --prepared ../prepared-report
