name: Trusted PR Report Comments

on:
  workflow_run:
    workflows: ["Playwright Tests", "Deploy to Cloudflare Pages", "vrt"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR from trusted workflow metadata
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const pull = run.pull_requests?.[0];
            if (!pull) {
              core.info('No pull request is associated with this workflow run.');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = pull.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });
            if (pullRequest.state !== 'open') {
              core.info(`PR #${issue_number} is no longer open.`);
              return;
            }

            const status = run.conclusion === 'success' ? 'Passed' : `Failed (${run.conclusion ?? 'unknown'})`;
            const actionsUrl = run.html_url;
            let marker;
            let body;

            if (run.name === 'Playwright Tests') {
              marker = '## Playwright Test Report';
              body = [
                marker,
                '',
                `Status: ${status}`,
                '',
                '| Action | Link |',
                '|---|---|',
                `| レポート確認 | [Actionsの非公開artifactを見る](${actionsUrl}) |`,
                '',
                'Details:',
                'trace・動画・tokenを含み得るため、レポートはActions artifactだけに保存します。',
              ].join('\n');
            } else if (run.name === 'Deploy to Cloudflare Pages') {
              marker = '## 🚀 Preview Deploy';
              const previewUrl = `https://pr-${issue_number}.dev-yps-crispy-carnival.pages.dev`;
              body = [
                marker,
                '',
                `Status: ${status}`,
                `**App:** ${previewUrl}`,
                `**Actions:** ${actionsUrl}`,
              ].join('\n');
            } else if (run.name === 'vrt') {
              marker = '## VRT Report';
              const reportUrl = `https://yn1323.github.io/hosting-pages/yps-crispy-carnival-vrt/pr-${issue_number}/?v=${run.id}-${run.run_attempt}`;
              body = [
                marker,
                '',
                `Status: ${status}`,
                '',
                '| Action | Link |',
                '|---|---|',
                `| 差分確認 | [差分レポートを見る](${reportUrl}) |`,
                `| 実行確認 | [Actionsを見る](${actionsUrl}) |`,
              ].join('\n');
            } else {
              core.setFailed(`Unexpected source workflow: ${run.name}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
