              action_required: 'Action required',
              skipped: 'Skipped',
              neutral: 'Neutral',
              stale: 'Stale',
              startup_failure: 'Startup failure',
            };
            let status = conclusionLabels[run.conclusion] ?? `Completed (${run.conclusion})`;
            if (validationResult !== 'success') {
              status = `Publisher validation failed (${validationResult})`;
            } else if (shouldPublish && !publicationSucceeded) {
