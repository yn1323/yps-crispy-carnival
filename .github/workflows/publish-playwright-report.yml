            const validationResult = process.env.VALIDATION_RESULT ?? '';
            const shouldPublish = process.env.SHOULD_PUBLISH === 'true';
            const publishResult = process.env.PUBLISH_RESULT ?? '';
            const reportDeployed = process.env.REPORT_DEPLOYED === 'true';
            const publishRunAttempt = Number(process.env.PUBLISH_RUN_ATTEMPT ?? '');
            if (
