name: Publish Trusted Playwright Report

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  E2E_REPORT_DIR: yps-crispy-carnival-e2e

jobs:
  validate-source:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.source.outputs.should_publish }}
      pull_number: ${{ steps.source.outputs.pull_number }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      source_result: ${{ steps.source.outputs.source_result }}
      report_url: ${{ steps.source.outputs.report_url }}
      preview_url: ${{ steps.source.outputs.preview_url }}
    steps:
      - name: Validate Playwright source and artifact declarations
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/playwright.yml';
            const allowedConclusions = new Set([
              'success',
              'failure',
              'cancelled',
              'timed_out',
              'action_required',
              'skipped',
              'neutral',
              'stale',
              'startup_failure',
            ]);
            core.setOutput('should_publish', 'false');

            if (
              run.name !== 'Playwright Tests' ||
              run.path !== expectedWorkflowPath ||
              run.event !== 'pull_request' ||
              run.head_repository?.full_name !== expectedRepository ||
              !allowedConclusions.has(run.conclusion) ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1
            ) {
              core.setFailed('Playwright publisher received invalid source workflow metadata.');
              return;
            }

            const pullNumber = run.pull_requests[0]?.number;
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('Playwright source workflow has an invalid pull request number.');
              return;
            }

            const [{ data: trustedWorkflow }, { data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'playwright.yml',
              }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }),
              github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: 'pull_request',
                head_sha: run.head_sha,
                per_page: 100,
              }),
            ]);
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === run.head_sha &&
                candidate.head_repository?.full_name === expectedRepository &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (
              trustedWorkflow.id !== run.workflow_id ||
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== run.head_sha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              liveRun.name !== run.name ||
              liveRun.workflow_id !== run.workflow_id ||
              liveRun.path !== expectedWorkflowPath ||
              liveRun.event !== run.event ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== run.conclusion ||
              liveRun.head_sha !== run.head_sha ||
              liveRun.run_attempt !== run.run_attempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== run.run_attempt
            ) {
              core.notice('Skipping a stale, closed, or superseded Playwright source run.');
              return;
            }

            core.setOutput('pull_number', String(pullNumber));
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('source_result', run.conclusion === 'success' ? 'success' : 'failure');
            core.setOutput(
              'report_url',
              `https://yn1323.github.io/hosting-pages/${process.env.E2E_REPORT_DIR}/pr-${pullNumber}/`,
            );
            core.setOutput(
              'preview_url',
              `https://pr-${pullNumber}.dev-yps-crispy-carnival.pages.dev/`,
            );

            if (!['success', 'failure'].includes(run.conclusion)) return;

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            const artifactNamePattern = /^(playwright-public-input|playwright-report)-([1-9][0-9]*)$/;
            const unexpected = available.filter((artifact) => {
              const match = artifact.name.match(artifactNamePattern);
              return !match || Number(match[2]) > run.run_attempt;
            });
            const publicInputs = available.filter(
              (artifact) => artifact.name === `playwright-public-input-${run.run_attempt}`,
            );
            const privateReports = available.filter(
              (artifact) => artifact.name === `playwright-report-${run.run_attempt}`,
            );

            if (
              unexpected.length > 0 ||
              publicInputs.length > 1 ||
              privateReports.length > 1 ||
              publicInputs.some(
                (artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 10 * 1024 * 1024,
              ) ||
              privateReports.some(
                (artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 500 * 1024 * 1024,
              )
            ) {
              core.setFailed('Playwright source artifact names, count, or declared sizes are invalid.');
              return;
            }

            if (publicInputs.length === 0) {
              if (run.conclusion === 'success') {
                core.setFailed('A successful Playwright source run must provide its public report input.');
              } else {
                core.notice('The failed Playwright run did not produce a publishable result artifact.');
              }
              return;
            }
            if (run.conclusion === 'success' && privateReports.length !== 1) {
              core.setFailed('A successful Playwright source run must preserve its private report artifact.');
              return;
            }

            core.setOutput('should_publish', 'true');

  publish:
    needs: validate-source
    if: |
      !cancelled() &&
      needs.validate-source.result == 'success' &&
      needs.validate-source.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Report Publisher
    concurrency:
      group: playwright-report-pr-${{ needs.validate-source.outputs.pull_number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      report_deployed: ${{ steps.wait-deploy.outputs.deploy_status == 'success' }}
      report_ready: ${{ steps.trusted-report-artifact.outcome == 'success' }}
    steps:
      - name: Checkout trusted Playwright publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Playwright public report input
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: playwright-public-input-${{ needs.validate-source.outputs.run_attempt }}
          path: trusted-artifacts/playwright-public-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate Playwright public report input
        run: |
          node scripts/assertStaticArtifactSafety.mjs \
            --profile playwright-public-input \
            --root trusted-artifacts/playwright-public-input
          node scripts/assertNoSensitiveArtifacts.mjs \
            --root trusted-artifacts/playwright-public-input
      - name: Build trusted public Playwright report
        env:
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          PLAYWRIGHT_RESULT: ${{ needs.validate-source.outputs.source_result }}
          PREVIEW_URL: ${{ needs.validate-source.outputs.preview_url }}
          PR_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          SOURCE_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node scripts/buildPublicPlaywrightReport.mjs \
            --input trusted-artifacts/playwright-public-input/test-results.json \
            --output playwright-public-report \
            --result "$PLAYWRIGHT_RESULT" \
            --pull-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --actions-url "$ACTIONS_URL" \
            --preview-url "$PREVIEW_URL"
      - name: Validate trusted public Playwright report
        run: |
          node scripts/assertStaticArtifactSafety.mjs \
            --profile playwright-public-report \
            --root playwright-public-report
          node scripts/assertNoSensitiveArtifacts.mjs --root playwright-public-report
      - name: Upload trusted public Playwright report
        id: trusted-report-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trusted-playwright-public-report
          path: playwright-public-report/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Revalidate Playwright source before credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/playwright.yml';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            const [{ data: trustedWorkflow }, { data: pullRequest }, { data: liveRun }, sourceRuns, artifacts] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'playwright.yml',
              }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }),
              github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: 'pull_request',
                head_sha: expectedHeadSha,
                per_page: 100,
              }),
              github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }),
            ]);
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === 'Playwright Tests' &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === expectedRepository &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            const publicInputs = artifacts.filter(
              (artifact) =>
                !artifact.expired && artifact.name === `playwright-public-input-${expectedRunAttempt}`,
            );
            if (
              run.name !== 'Playwright Tests' ||
              run.path !== expectedWorkflowPath ||
              run.workflow_id !== trustedWorkflow.id ||
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.event !== 'pull_request' ||
              !['success', 'failure'].includes(run.conclusion) ||
              run.head_repository?.full_name !== expectedRepository ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              liveRun.status !== 'completed' ||
              liveRun.workflow_id !== trustedWorkflow.id ||
              liveRun.path !== expectedWorkflowPath ||
              liveRun.conclusion !== run.conclusion ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt ||
              publicInputs.length !== 1 ||
              publicInputs[0].size_in_bytes <= 0 ||
              publicInputs[0].size_in_bytes > 10 * 1024 * 1024
            ) {
              core.setFailed('Playwright source changed before publication credentials were enabled.');
            }
      - name: Checkout E2E hosting pages
        env:
          HOSTING_PAGES_TOKEN: ${{ secrets.REPORT_PUBLISHER_HOSTING_PAGES_TOKEN }}
        run: |
          git clone --depth 1 --single-branch \
            "https://x-access-token:${HOSTING_PAGES_TOKEN}@github.com/yn1323/hosting-pages.git" \
            hosting-pages
      - name: Revalidate Playwright source before publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/playwright.yml';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            const [{ data: trustedWorkflow }, { data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'playwright.yml',
              }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }),
              github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: 'pull_request',
                head_sha: expectedHeadSha,
                per_page: 100,
              }),
            ]);
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                candidate.name === 'Playwright Tests' &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === expectedRepository &&
                candidate.pull_requests?.some((pull) => pull.number === pullNumber),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (
              run.name !== 'Playwright Tests' ||
              run.path !== expectedWorkflowPath ||
              run.workflow_id !== trustedWorkflow.id ||
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.event !== 'pull_request' ||
              !['success', 'failure'].includes(run.conclusion) ||
              run.head_repository?.full_name !== expectedRepository ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'develop' ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              liveRun.status !== 'completed' ||
              liveRun.workflow_id !== trustedWorkflow.id ||
              liveRun.path !== expectedWorkflowPath ||
              liveRun.conclusion !== run.conclusion ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt
            ) {
              core.setFailed('Playwright source changed immediately before report publication.');
            }
      - name: Publish trusted Playwright report
        env:
          HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected Playwright report destination."
            exit 1
          fi
          REPORT_TARGET="hosting-pages/${E2E_REPORT_DIR}/pr-${PR_NUMBER}"
          rm -rf "$REPORT_TARGET"
          mkdir -p "$REPORT_TARGET"
          cp -R playwright-public-report/. "$REPORT_TARGET/"
          echo "${PUBLISH_RUN_ID}-${PUBLISH_RUN_ATTEMPT}" > "$REPORT_TARGET/deploy-marker-${PUBLISH_RUN_ID}-${PUBLISH_RUN_ATTEMPT}.txt"

          cd hosting-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${E2E_REPORT_DIR}/pr-${PR_NUMBER}"
          git commit -m "E2E report for PR #${PR_NUMBER} at ${HEAD_SHA}"
          bash "$GITHUB_WORKSPACE/scripts/pushHostingPagesWithRetry.sh"
      - name: Wait for trusted Playwright report deploy
        id: wait-deploy
        env:
          REPORT_URL: ${{ needs.validate-source.outputs.report_url }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER_URL="${REPORT_URL}deploy-marker-${PUBLISH_RUN_ID}-${PUBLISH_RUN_ATTEMPT}.txt"
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --output /dev/null "${MARKER_URL}?t=$(date +%s)"; then
              echo "deploy_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Trusted Playwright report deploy could not be confirmed within 15 minutes."
          exit 1

  comment:
    needs: [validate-source, publish]
    if: |
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download trusted Playwright report for comment
        if: ${{ needs.publish.outputs.report_ready == 'true' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: trusted-playwright-public-report
          path: trusted-playwright-public-report
      - name: Comment PR with trusted Playwright result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VALIDATION_RESULT: ${{ needs.validate-source.result }}
          SHOULD_PUBLISH: ${{ needs.validate-source.outputs.should_publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REPORT_DEPLOYED: ${{ needs.publish.outputs.report_deployed }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- shiftori-playwright-report:v1 -->';
            const heading = '## Playwright Test Report';
            const otherMarker = '<!-- shiftori-vrt-report:v1 -->';
            const otherHeading = '## VRT Report';
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/playwright.yml';
            const issueNumber = run.pull_requests?.[0]?.number;
            const allowedConclusions = new Set([
              'success',
              'failure',
              'cancelled',
              'timed_out',
              'action_required',
              'skipped',
              'neutral',
              'stale',
              'startup_failure',
            ]);
            if (
              run.name !== 'Playwright Tests' ||
              run.path !== expectedWorkflowPath ||
              run.event !== 'pull_request' ||
              run.head_repository?.full_name !== expectedRepository ||
              !allowedConclusions.has(run.conclusion) ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1 ||
              !Number.isSafeInteger(issueNumber) ||
              issueNumber <= 0
            ) {
              core.setFailed('Playwright comment source metadata is invalid.');
              return;
            }

            const loadCurrentSource = async () => {
              const [{ data: trustedWorkflow }, { data: pullRequest }, { data: liveRun }, sourceRuns] = await Promise.all([
                github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'playwright.yml',
                }),
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issueNumber,
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
                github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: run.workflow_id,
                  event: 'pull_request',
                  head_sha: run.head_sha,
                  per_page: 100,
                }),
              ]);
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === 'pull_request' &&
                  candidate.head_sha === run.head_sha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === issueNumber),
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return { trustedWorkflow, pullRequest, liveRun, latestSourceRun };
            };
            const isCurrentSource = ({ trustedWorkflow, pullRequest, liveRun, latestSourceRun }) =>
              trustedWorkflow.id === run.workflow_id &&
              trustedWorkflow.path === expectedWorkflowPath &&
              trustedWorkflow.state === 'active' &&
              pullRequest.state === 'open' &&
              pullRequest.base.ref === 'develop' &&
