              const existingAttempt = BigInt(existingState[3]);
              if (
                existingRunId > BigInt(run.id) ||
                (existingRunId === BigInt(run.id) && existingAttempt > BigInt(run.run_attempt))
              ) {
                core.notice('Skipping an older Playwright result comment update.');
                return;
              }
            }

            if (!isCurrentSource(await loadCurrentSource())) {
              core.notice('Skipping Playwright result comment after the source changed.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
