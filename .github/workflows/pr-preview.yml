name: PR Preview Artifact

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview-artifact:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    environment: PR Preview Public
    env:
      # 機密secretを持たない専用Environmentから、成果物へ埋め込まれるbrowser公開値だけを参照する。
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build static preview artifact
        run: pnpm build
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Prerender static routes
        run: pnpm prerender
      - name: Scan static preview artifact
        run: node scripts/assertNoSensitiveArtifacts.mjs --root dist
      - name: Upload static preview artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
