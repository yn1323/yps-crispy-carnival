        run: pnpm vrt:assert
      - name: Read trusted VRT result counts
        id: vrt-counts
        run: |
          node <<'NODE'
            const fs = require('node:fs');
            const result = JSON.parse(fs.readFileSync('vrt-work/reg/out.json', 'utf8'));
            const fields = {
              changed_count: result.failedItems,
              new_count: result.newItems,
              deleted_count: result.deletedItems,
              passed_count: result.passedItems,
            };
            const output = process.env.GITHUB_OUTPUT;
            for (const [name, items] of Object.entries(fields)) {
              if (!Array.isArray(items)) throw new Error(`RegSuit result is missing ${name}.`);
              fs.appendFileSync(output, `${name}=${items.length}\n`);
            }
          NODE
      - name: Validate generated VRT report
        run: node scripts/assertStaticArtifactSafety.mjs --profile vrt-report --root vrt-work/reg
      - name: Scan generated VRT report
        run: node scripts/assertNoSensitiveArtifacts.mjs --root vrt-work/reg
      - name: Revalidate VRT source immediately before publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const eventRun = context.payload.workflow_run;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            const baselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumberValue = process.env.EXPECTED_PULL_NUMBER ?? '';
            const reportKey = process.env.EXPECTED_REPORT_KEY ?? '';
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (
              !Number.isSafeInteger(eventRun.id) ||
              eventRun.id <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha)
            ) {
              core.setFailed('VRT source identity changed before publication.');
              return;
            }

            const [{ data: trustedWorkflow }, { data: run }] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'vrt.yml',
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              }),
            ]);
            if (
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.name !== 'VRT Artifact' ||
              run.workflow_id !== trustedWorkflow.id ||
              run.path !== expectedWorkflowPath ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.status !== 'completed' ||
              run.conclusion !== 'success'
            ) {
              core.setFailed('VRT source run was superseded before publication.');
              return;
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_branch === run.head_branch &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (pullNumberValue !== '' || candidate.head_branch === baselineRef),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== expectedRunAttempt) {
              core.setFailed('A newer VRT source run exists before publication.');
              return;
            }

            if (pullNumberValue) {
              const pullNumber = Number(pullNumberValue);
              if (
                run.event !== 'pull_request' ||
                !Number.isSafeInteger(pullNumber) ||
                pullNumber <= 0 ||
                run.pull_requests?.length !== 1 ||
                run.pull_requests[0]?.number !== pullNumber ||
                reportKey !== `pr-${pullNumber}`
              ) {
                core.setFailed('VRT pull request source identity changed before publication.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== baselineRef ||
                pullRequest.head.sha !== expectedHeadSha ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT source is no longer the current open pull request head.');
                return;
              }
            } else {
              if (
                run.event !== 'push' ||
                !['develop', 'main'].includes(baselineRef) ||
                run.head_branch !== baselineRef ||
                reportKey !== `branches/${baselineRef}`
              ) {
                core.setFailed('VRT branch source identity changed before publication.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: baselineRef,
              });
              if (branch.commit.sha !== expectedHeadSha) {
                core.setFailed('VRT source is no longer the current branch head.');
              }
            }
      - name: Publish trusted VRT report and baseline
        env:
          HOSTING_PAGES_TOKEN: ${{ secrets.REPORT_PUBLISHER_HOSTING_PAGES_TOKEN }}
          REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          SHOULD_UPDATE_BASELINE: ${{ needs.validate-source.outputs.should_update_baseline }}
        run: |
          set -euo pipefail
          if ! [[ "$REPORT_KEY" =~ ^(pr-[1-9][0-9]*|branches/(develop|main))$ ]]; then
            echo "::error::Unexpected VRT report key."
            exit 1
          fi

          REPORT_TARGET="hosting-pages/${VRT_REPORT_DIR}/${REPORT_KEY}"
          rm -rf "$REPORT_TARGET"
          mkdir -p "$REPORT_TARGET"
          cp -R vrt-work/reg/. "$REPORT_TARGET/"
          echo "${{ github.run_id }}-${{ github.run_attempt }}" > "$REPORT_TARGET/deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"

          if [ "$SHOULD_UPDATE_BASELINE" = "true" ]; then
            BASELINE_TARGET="hosting-pages/${VRT_BASELINE_DIR}/${REPORT_KEY#branches/}"
            rm -rf "$BASELINE_TARGET"
            mkdir -p "$BASELINE_TARGET"
            cp -R vrt-actual/. "$BASELINE_TARGET/"
          fi

          cd hosting-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${HOSTING_PAGES_TOKEN}@github.com/yn1323/hosting-pages.git"
          git add -- "${VRT_REPORT_DIR}/${REPORT_KEY}"
          if [ "$SHOULD_UPDATE_BASELINE" = "true" ]; then
            git add -- "${VRT_BASELINE_DIR}/${REPORT_KEY#branches/}"
          fi
          git commit -m "VRT report for ${REPORT_KEY} at ${HEAD_SHA}"
          bash "$GITHUB_WORKSPACE/scripts/pushHostingPagesWithRetry.sh"
      - name: Wait for trusted VRT report deploy
        id: wait-deploy
        if: ${{ needs.validate-source.outputs.pull_number != '' }}
        env:
          REPORT_URL: ${{ needs.validate-source.outputs.report_url }}
        run: |
          MARKER_URL="${REPORT_URL}deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "${MARKER_URL}?t=$(date +%s)"; then
              echo "deploy_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Trusted VRT report deploy could not be confirmed within 15 minutes."
          exit 1
  comment-publication-result:
    needs: [comment-source-status, validate-source, publish]
    if: |
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-status-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Comment PR with trusted VRT publication result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
          VALIDATION_RESULT: ${{ needs.validate-source.result }}
          SHOULD_PUBLISH: ${{ needs.validate-source.outputs.should_publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REPORT_DEPLOYED: ${{ needs.publish.outputs.report_deployed }}
          HAS_DIFF: ${{ needs.publish.outputs.report_has_diff }}
          CHANGED_COUNT: ${{ needs.publish.outputs.changed_count }}
          NEW_COUNT: ${{ needs.publish.outputs.new_count }}
          DELETED_COUNT: ${{ needs.publish.outputs.deleted_count }}
          PASSED_COUNT: ${{ needs.publish.outputs.passed_count }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT_URL: ${{ needs.validate-source.outputs.report_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-vrt-report:v1 -->';
            const heading = '## VRT Report';
            const otherMarker = '<!-- shiftori-playwright-report:v1 -->';
            const otherHeading = '## Playwright Test Report';
            const eventRun = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            const outputBaselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const outputHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const outputIssueNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const outputSourceRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            const validationResult = process.env.VALIDATION_RESULT ?? '';
            const shouldPublish = process.env.SHOULD_PUBLISH ?? '';
            const publishResult = process.env.PUBLISH_RESULT ?? '';
            const reportDeployed = process.env.REPORT_DEPLOYED ?? '';
            const hasDiffValue = process.env.HAS_DIFF ?? '';
            const countValues = {
              changed: process.env.CHANGED_COUNT ?? '',
              new: process.env.NEW_COUNT ?? '',
              deleted: process.env.DELETED_COUNT ?? '',
              passed: process.env.PASSED_COUNT ?? '',
            };
            const publishRunAttempt = process.env.PUBLISH_RUN_ATTEMPT ?? '';
            const reportBaseUrl = process.env.REPORT_URL ?? '';
            const allowedJobResults = ['success', 'failure', 'cancelled', 'skipped'];
            if (!Number.isSafeInteger(eventRun.id) || eventRun.id <= 0) {
              core.setFailed('VRT source run identity is invalid at comment time.');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: eventRun.id,
            });
            const expectedHeadSha = run.head_sha ?? '';
            const issueNumber = run.pull_requests?.[0]?.number;
            const expectedSourceRunAttempt = run.run_attempt;
            const validationSucceeded = validationResult === 'success' && shouldPublish === 'true';
            if (
              run.name !== 'VRT Artifact' ||
              run.path !== expectedWorkflowPath ||
              run.event !== 'pull_request' ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(expectedSourceRunAttempt) ||
              expectedSourceRunAttempt <= 0 ||
              run.run_attempt !== expectedSourceRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== issueNumber ||
              !Number.isSafeInteger(issueNumber) ||
              issueNumber <= 0 ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              !/^[1-9][0-9]*$/.test(publishRunAttempt) ||
              !allowedJobResults.includes(validationResult) ||
              !['', 'true', 'false'].includes(shouldPublish) ||
              !allowedJobResults.includes(publishResult) ||
              !['', 'true', 'false'].includes(reportDeployed) ||
              !['', 'true', 'false'].includes(hasDiffValue) ||
              Object.values(countValues).some((value) => value !== '' && !/^(0|[1-9][0-9]*)$/.test(value))
            ) {
              core.setFailed('VRT source identity is invalid at comment time.');
              return;
            }
            if (
              validationSucceeded &&
              (
                outputBaselineRef === '' ||
                outputHeadSha !== expectedHeadSha ||
                outputIssueNumber !== issueNumber ||
                outputSourceRunAttempt !== expectedSourceRunAttempt ||
                reportBaseUrl !== `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/pr-${issueNumber}/`
              )
            ) {
              core.setFailed('Validated VRT outputs changed before the terminal comment.');
              return;
            }

            const sourceRunIsCurrent = async () => {
              const [{ data: trustedWorkflow }, { data: liveRun }] = await Promise.all([
                github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'vrt.yml',
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
              ]);
              if (
                trustedWorkflow.id !== run.workflow_id ||
                trustedWorkflow.path !== expectedWorkflowPath ||
                trustedWorkflow.state !== 'active' ||
                liveRun.name !== 'VRT Artifact' ||
                liveRun.workflow_id !== trustedWorkflow.id ||
                liveRun.path !== expectedWorkflowPath ||
                liveRun.event !== 'pull_request' ||
                liveRun.head_sha !== expectedHeadSha ||
                liveRun.run_attempt !== expectedSourceRunAttempt ||
                liveRun.status !== 'completed' ||
                liveRun.conclusion !== 'success'
              ) {
                return false;
              }

              const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: run.event,
                per_page: 100,
              });
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === run.event &&
                  candidate.head_sha === expectedHeadSha &&
                  candidate.head_branch === run.head_branch &&
                  candidate.head_repository?.full_name === expectedRepository,
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return latestSourceRun?.id === run.id && latestSourceRun.run_attempt === expectedSourceRunAttempt;
            };
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT result comment from a superseded source run.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            const baselineRef = pullRequest.base?.ref;
            if (
              pullRequest.state !== 'open' ||
              !['develop', 'main'].includes(baselineRef) ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              (validationSucceeded && baselineRef !== outputBaselineRef)
            ) {
              core.notice('Skipping a stale or closed VRT result comment.');
              return;
            }

            const publicationSucceeded =
              validationSucceeded &&
              publishResult === 'success' &&
              reportDeployed === 'true';
            const hasDiff = hasDiffValue === 'true';
            const plannedReportUrl = `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/pr-${issueNumber}/`;
            const reportUrl = publicationSucceeded
              ? `${plannedReportUrl}?v=${context.runId}-${publishRunAttempt}`
              : plannedReportUrl;
            const reportLinkLabel = publicationSucceeded
              ? 'hosting-pagesで差分レポートを見る'
              : 'hosting-pagesの予定URLを開く（未公開の場合あり）';
            const status = !validationSucceeded
              ? `Trusted report検証失敗（${validationResult}）`
              : publicationSucceeded
                ? (hasDiff ? '差分あり（承認待ち）' : 'Passed')
                : `Trusted report公開失敗（${publishResult}）`;
            const phase = 3;
            const stateMarker = `<!-- shiftori-vrt-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const sourceActionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const publisherActionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              `差分: Changed ${countValues.changed || 'unknown'} / New ${countValues.new || 'unknown'} / Deleted ${countValues.deleted || 'unknown'}`,
              `Passed: ${countValues.passed || 'unknown'}`,
              '',
              '| Action | Link |',
              '|---|---|',
              `| 差分確認 | [${reportLinkLabel}](${reportUrl}) |`,
              ...(hasDiff ? [`| 承認 | [VRT差分を確認・承認する](${publisherActionsUrl}) |`] : []),
              '',
              'Details:',
              'デプロイ先: [yn1323/hosting-pages:main](https://github.com/yn1323/hosting-pages/commits/main/)',
              `VRT実行: [source Actionsを見る](${sourceActionsUrl})`,
              `Trusted publisher: [Actionsを見る](${publisherActionsUrl})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const botComments = [...comments].reverse().filter(
              (comment) => comment.user?.login === 'github-actions[bot]',
            );
            const markedComment = botComments.find((comment) => comment.body?.includes(marker));
            const legacyCandidates = botComments.filter((comment) => {
              const body = comment.body?.trimStart() ?? '';
              return body.startsWith(`${heading}\n`) &&
                body.includes('\nStatus: ') &&
                body.includes('\n| Action | Link |\n') &&
                body.includes(plannedReportUrl) &&
                !body.includes(otherMarker) &&
                !body.includes(otherHeading);
            });
            const existing = markedComment ?? (legacyCandidates.length === 1 ? legacyCandidates[0] : undefined);
            const existingState = existing?.body?.match(
              /<!-- shiftori-vrt-state:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):([1-4]) -->/,
            );
            if (existingState?.[1] === run.head_sha) {
              const existingRunId = BigInt(existingState[2]);
              const existingAttempt = BigInt(existingState[3]);
              const existingPhase = Number(existingState[4]);
              if (
                existingRunId > BigInt(run.id) ||
                (existingRunId === BigInt(run.id) && existingAttempt > BigInt(run.run_attempt)) ||
                (
                  existingRunId === BigInt(run.id) &&
                  existingAttempt === BigInt(run.run_attempt) &&
                  existingPhase > phase
                )
              ) {
                core.notice('Skipping an older VRT result comment update.');
                return;
              }
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            if (
              currentPullRequest.state !== 'open' ||
              currentPullRequest.base.ref !== baselineRef ||
              currentPullRequest.head.sha !== expectedHeadSha ||
              currentPullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.notice('Skipping a VRT result update after the pull request head changed.');
              return;
            }
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT result update after the source run changed.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
            const { data: gatePullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            if (
              gatePullRequest.state !== 'open' ||
              gatePullRequest.base.ref !== baselineRef ||
              gatePullRequest.head.sha !== expectedHeadSha ||
              gatePullRequest.head.repo?.full_name !== expectedRepository ||
              !(await sourceRunIsCurrent())
            ) {
              core.notice('Skipping the terminal VRT gate status after the source or pull request changed.');
              return;
            }
            const gateState = publicationSucceeded
              ? (hasDiff ? 'pending' : 'success')
              : 'failure';
            const gateDescription = publicationSucceeded
              ? (hasDiff ? 'VRT differences await approval' : 'Trusted VRT report passed')
              : 'Trusted VRT report publication failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedHeadSha,
              state: gateState,
              context: 'shiftori/vrt-approval',
              description: gateDescription,
              target_url: publisherActionsUrl,
            });

  approve-pr-publication:
    name: approve
    needs: [validate-source, publish, comment-publication-result]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-source.result == 'success' &&
      needs.validate-source.outputs.should_publish == 'true' &&
      needs.validate-source.outputs.pull_number != '' &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.report_deployed == 'true' &&
      needs.publish.outputs.report_has_diff == 'true' &&
      needs.comment-publication-result.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-approval-pr-${{ needs.validate-source.outputs.pull_number }}
      cancel-in-progress: true
    environment:
      name: vrt-approval
      url: ${{ needs.validate-source.outputs.report_url }}?v=${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Approve current trusted VRT differences
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const eventRun = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const expectedBaselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (!Number.isSafeInteger(eventRun.id) || eventRun.id <= 0) {
              core.setFailed('VRT approval source run identity is invalid.');
              return;
            }
            const [{ data: trustedWorkflow }, { data: run }, { data: pullRequest }] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'vrt.yml',
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              }),
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }),
            ]);
            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: trustedWorkflow.id,
              event: 'pull_request',
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === 'VRT Artifact' &&
                candidate.workflow_id === trustedWorkflow.id &&
                candidate.event === 'pull_request' &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_branch === run.head_branch &&
                candidate.head_repository?.full_name === expectedRepository,
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (
              run.name !== 'VRT Artifact' ||
              run.path !== expectedWorkflowPath ||
              run.event !== 'pull_request' ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== expectedRepository ||
              run.workflow_id !== trustedWorkflow.id ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== pullNumber ||
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== expectedBaselineRef ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              latestSourceRun?.id !== run.id ||
              latestSourceRun.run_attempt !== expectedRunAttempt
            ) {
              core.setFailed('VRT approval is no longer attached to the current trusted PR source.');
            }

  comment-after-approval:
    needs: [validate-source, publish, comment-publication-result, approve-pr-publication]
    if: |
      always() &&
      needs.approve-pr-publication.result == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-status-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Mark trusted VRT differences as approved
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-vrt-report:v1 -->';
            const eventRun = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const expectedBaselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const pullNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (!Number.isSafeInteger(eventRun.id) || eventRun.id <= 0) {
              core.setFailed('VRT approval comment source run identity is invalid.');
              return;
            }
            const pendingState = `<!-- shiftori-vrt-state:${expectedHeadSha}:${eventRun.id}:${expectedRunAttempt}:3 -->`;
            const approvedState = `<!-- shiftori-vrt-state:${expectedHeadSha}:${eventRun.id}:${expectedRunAttempt}:4 -->`;

            const loadCurrentSource = async () => {
              const [{ data: trustedWorkflow }, { data: liveRun }, { data: pullRequest }, sourceRuns] = await Promise.all([
                github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'vrt.yml',
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: eventRun.id,
                }),
                github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                }),
                github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'vrt.yml',
                  event: 'pull_request',
                  per_page: 100,
                }),
              ]);
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === 'VRT Artifact' &&
                  candidate.workflow_id === trustedWorkflow.id &&
                  candidate.event === 'pull_request' &&
                  candidate.head_sha === expectedHeadSha &&
                  candidate.head_branch === liveRun.head_branch &&
                  candidate.head_repository?.full_name === expectedRepository,
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return { trustedWorkflow, liveRun, pullRequest, latestSourceRun };
            };
            const isCurrentSource = ({ trustedWorkflow, liveRun, pullRequest, latestSourceRun }) =>
              trustedWorkflow.path === expectedWorkflowPath &&
              trustedWorkflow.state === 'active' &&
              liveRun.id === eventRun.id &&
              liveRun.name === 'VRT Artifact' &&
              liveRun.workflow_id === trustedWorkflow.id &&
              liveRun.path === expectedWorkflowPath &&
              liveRun.event === 'pull_request' &&
              liveRun.head_repository?.full_name === expectedRepository &&
              liveRun.pull_requests?.length === 1 &&
              liveRun.pull_requests[0]?.number === pullNumber &&
              liveRun.status === 'completed' &&
              liveRun.conclusion === 'success' &&
              liveRun.head_sha === expectedHeadSha &&
              liveRun.run_attempt === expectedRunAttempt &&
              pullRequest.state === 'open' &&
              pullRequest.base.ref === expectedBaselineRef &&
              pullRequest.head.sha === expectedHeadSha &&
              pullRequest.head.repo?.full_name === expectedRepository &&
              latestSourceRun?.id === eventRun.id &&
              latestSourceRun.run_attempt === expectedRunAttempt;

            if (!(await loadCurrentSource().then(isCurrentSource))) {
              core.notice('Skipping approval comment for a stale VRT source.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );
            const alreadyApproved = existing?.body?.includes(approvedState) ?? false;
            if (!alreadyApproved) {
              if (
                !existing?.body?.includes(pendingState) ||
                !existing.body.includes('Status: 差分あり（承認待ち）') ||
                !existing.body.includes('| 承認 | [VRT差分を確認・承認する](')
              ) {
                core.setFailed('The current trusted VRT report comment is missing before approval update.');
                return;
              }
              const body = existing.body
                .replace(pendingState, approvedState)
                .replace('Status: 差分あり（承認待ち）', 'Status: 差分あり（承認済み）')
                .replace('| 承認 | [VRT差分を確認・承認する](', '| 承認履歴 | [承認済みjobを見る](');
              if (!(await loadCurrentSource().then(isCurrentSource))) {
                core.notice('Skipping approval comment after the VRT source changed.');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

            if (!(await loadCurrentSource().then(isCurrentSource))) {
              core.notice('Skipping approval gate update after the VRT source changed.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedHeadSha,
              state: 'success',
              context: 'shiftori/vrt-approval',
              description: 'Trusted VRT differences approved',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (alreadyApproved) {
              core.notice('Trusted VRT approval was already reflected; restored the PR-head gate status.');
            }
