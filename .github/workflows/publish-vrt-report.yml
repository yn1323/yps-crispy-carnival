name: Publish Trusted VRT Report

on:
  workflow_run:
    workflows: ["VRT Artifact"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: publish-vrt-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  VRT_REPORT_DIR: yps-crispy-carnival-vrt
  VRT_BASELINE_DIR: yps-crispy-carnival-vrt-baselines

jobs:
  comment-source-status:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-status-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Comment PR with VRT source status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-vrt-report:v1 -->';
            const heading = '## VRT Report';
            const otherMarker = '<!-- shiftori-playwright-report:v1 -->';
            const otherHeading = '## Playwright Test Report';
            const eventRun = context.payload.workflow_run;
            const action = context.payload.action;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';

            if (
              action !== 'completed' ||
              !Number.isSafeInteger(eventRun.id) ||
              eventRun.id <= 0
            ) {
              core.setFailed('Unexpected VRT source workflow metadata for PR status comment.');
              return;
            }

            const [{ data: trustedWorkflow }, { data: run }] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'vrt.yml',
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              }),
            ]);
            if (
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.name !== 'VRT Artifact' ||
              run.workflow_id !== trustedWorkflow.id ||
              run.path !== expectedWorkflowPath ||
              run.event !== 'pull_request' ||
              run.status !== 'completed' ||
              typeof run.conclusion !== 'string' ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1
            ) {
              core.setFailed('VRT source workflow is not the trusted completed PR workflow.');
              return;
            }

            const pullNumber = run.pull_requests[0]?.number;
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('VRT source workflow has an invalid pull request number.');
              return;
            }

            const sourceRunIsCurrent = async () => {
              const [{ data: currentWorkflow }, { data: liveRun }] = await Promise.all([
                github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'vrt.yml',
                }),
                github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                }),
              ]);
              if (
                currentWorkflow.id !== run.workflow_id ||
                currentWorkflow.path !== expectedWorkflowPath ||
                currentWorkflow.state !== 'active' ||
                liveRun.name !== run.name ||
                liveRun.workflow_id !== run.workflow_id ||
                liveRun.path !== expectedWorkflowPath ||
                liveRun.event !== run.event ||
                liveRun.head_sha !== run.head_sha ||
                liveRun.run_attempt !== run.run_attempt ||
                liveRun.status !== 'completed' ||
                liveRun.conclusion !== run.conclusion
              ) {
                return false;
              }

              const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: run.event,
                per_page: 100,
              });
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === run.event &&
                  candidate.head_sha === run.head_sha &&
                  candidate.head_branch === run.head_branch &&
                  candidate.head_repository?.full_name === expectedRepository,
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return latestSourceRun?.id === run.id && latestSourceRun.run_attempt === run.run_attempt;
            };
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a superseded VRT source workflow status.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
              core.notice('Skipping a stale or closed VRT pull request status.');
              return;
            }
            if (
              !['develop', 'main'].includes(pullRequest.base.ref) ||
              pullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.setFailed('VRT status comment crosses an unexpected repository boundary.');
              return;
            }

            const publisherActionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sourceGateState = run.conclusion === 'success'
              ? 'pending'
              : 'failure';
            const sourceGateDescription = run.conclusion === 'success'
              ? 'Trusted VRT report publication is pending'
              : `VRT source ${run.conclusion}`;
            const { data: gatePullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (
              gatePullRequest.state !== 'open' ||
              gatePullRequest.base.ref !== pullRequest.base.ref ||
              gatePullRequest.head.sha !== run.head_sha ||
              gatePullRequest.head.repo?.full_name !== expectedRepository ||
              !(await sourceRunIsCurrent())
            ) {
              core.notice('Skipping the VRT gate status after the source or pull request changed.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state: sourceGateState,
              context: 'shiftori/vrt-approval',
              description: sourceGateDescription,
              target_url: publisherActionsUrl,
            });

            const conclusionLabels = {
              success: '比較完了（trusted reportを公開中）',
              failure: '失敗',
              cancelled: 'キャンセル',
              timed_out: 'タイムアウト',
              action_required: '要対応',
              skipped: 'スキップ',
              neutral: '完了（neutral）',
              stale: '期限切れ',
              startup_failure: '起動失敗',
            };
            const status = conclusionLabels[run.conclusion] ?? `完了（${run.conclusion}）`;
            const phase = 2;
            const stateMarker = `<!-- shiftori-vrt-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const reportUrl = `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/pr-${pullNumber}/`;
            const sourceActionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              '差分: Changed - / New - / Deleted -',
              'Passed: -',
              '',
              '| Action | Link |',
              '|---|---|',
              `| 差分確認 | [hosting-pagesの予定URLを開く（未公開の場合あり）](${reportUrl}) |`,
              `| Trusted report公開 | [publisherの確認・承認へ進む](${publisherActionsUrl}) |`,
              '',
              'Details:',
              'デプロイ先: [yn1323/hosting-pages:main](https://github.com/yn1323/hosting-pages/commits/main/)',
              `VRT実行: [source Actionsを見る](${sourceActionsUrl})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const botComments = [...comments].reverse().filter(
              (comment) => comment.user?.login === 'github-actions[bot]',
            );
            const markedComment = botComments.find((comment) => comment.body?.includes(marker));
            const legacyCandidates = botComments.filter((comment) => {
              const body = comment.body?.trimStart() ?? '';
              return body.startsWith(`${heading}\n`) &&
                body.includes('\nStatus: ') &&
                body.includes('\n| Action | Link |\n') &&
                body.includes(reportUrl) &&
                !body.includes(otherMarker) &&
                !body.includes(otherHeading);
            });
            const existing = markedComment ?? (legacyCandidates.length === 1 ? legacyCandidates[0] : undefined);
            const existingState = existing?.body?.match(
              /<!-- shiftori-vrt-state:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):([1-4]) -->/,
            );
            if (existingState?.[1] === run.head_sha) {
              const existingRunId = BigInt(existingState[2]);
              const existingAttempt = BigInt(existingState[3]);
              const existingPhase = Number(existingState[4]);
              if (
                existingRunId > BigInt(run.id) ||
                (existingRunId === BigInt(run.id) && existingAttempt > BigInt(run.run_attempt)) ||
                (
                  existingRunId === BigInt(run.id) &&
                  existingAttempt === BigInt(run.run_attempt) &&
                  existingPhase > phase
                )
              ) {
                core.notice('Skipping an older VRT source status comment update.');
                return;
              }
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (currentPullRequest.state !== 'open' || currentPullRequest.head.sha !== run.head_sha) {
              core.notice('Skipping a VRT status update after the pull request head changed.');
              return;
            }
            if (
              !['develop', 'main'].includes(currentPullRequest.base.ref) ||
              currentPullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.setFailed('VRT status target changed repository boundary before comment write.');
              return;
            }
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT status update after the source run changed.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }

  validate-source:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.source.outputs.should_publish }}
      pull_number: ${{ steps.source.outputs.pull_number }}
      report_key: ${{ steps.source.outputs.report_key }}
      baseline_ref: ${{ steps.source.outputs.baseline_ref }}
      should_update_baseline: ${{ steps.source.outputs.should_update_baseline }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      report_url: ${{ steps.source.outputs.report_url }}
    steps:
      - name: Validate source workflow metadata and artifact declarations
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const eventRun = context.payload.workflow_run;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            core.setOutput('should_publish', 'false');
            if (
              !Number.isSafeInteger(eventRun.id) ||
              eventRun.id <= 0
            ) {
              core.setFailed('VRT source run identity is invalid.');
              return;
            }

            const [{ data: trustedWorkflow }, { data: run }] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'vrt.yml',
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              }),
            ]);
            if (
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.name !== 'VRT Artifact' ||
              run.workflow_id !== trustedWorkflow.id ||
              run.path !== expectedWorkflowPath ||
              !['pull_request', 'push'].includes(run.event) ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0
            ) {
              core.setFailed('VRT source workflow is not the trusted current workflow identity.');
              return;
            }

            let pullNumber = '';
            let reportKey;
            let baselineRef;
            let shouldUpdateBaseline = 'false';
            if (run.event === 'pull_request') {
              if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed('VRT report publishing is limited to same-repository pull requests.');
                return;
              }
              const pull = run.pull_requests?.[0];
              if (!pull || run.pull_requests.length !== 1) {
                core.setFailed('Exactly one pull request must be associated with VRT data.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
              });
              if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
                core.notice('Skipping a stale or closed VRT pull request run.');
                return;
              }
              if (
                !['develop', 'main'].includes(pullRequest.base.ref) ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT pull request crosses an unexpected repository boundary.');
                return;
              }
              pullNumber = String(pull.number);
              reportKey = `pr-${pull.number}`;
              baselineRef = pullRequest.base.ref;
            } else {
              if (!['develop', 'main'].includes(run.head_branch)) {
                core.setFailed('VRT push source must be develop or main.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: run.head_branch,
              });
              if (branch.commit.sha !== run.head_sha) {
                core.notice('Skipping a superseded VRT branch run.');
                return;
              }
              reportKey = `branches/${run.head_branch}`;
              baselineRef = run.head_branch;
              shouldUpdateBaseline = 'true';
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === run.head_sha &&
                candidate.head_branch === run.head_branch &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (run.event === 'pull_request' || candidate.head_branch === baselineRef),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== run.run_attempt) {
              core.notice('Skipping a superseded VRT source workflow run.');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            const expectedNames = ['vrt-actual-1', 'vrt-actual-2', 'vrt-actual-3', 'vrt-actual-4'];
            const actualNames = available.map((artifact) => artifact.name).sort();
            const totalBytes = available.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            if (
              actualNames.length !== expectedNames.length ||
              actualNames.some((name, index) => name !== expectedNames[index]) ||
              available.some((artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 200 * 1024 * 1024) ||
              totalBytes > 500 * 1024 * 1024
            ) {
              core.setFailed('VRT artifact names, count, or declared sizes are invalid.');
              return;
            }

            core.setOutput('should_publish', 'true');
            core.setOutput('pull_number', pullNumber);
            core.setOutput('report_key', reportKey);
            core.setOutput('baseline_ref', baselineRef);
            core.setOutput('should_update_baseline', shouldUpdateBaseline);
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput(
              'report_url',
              `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/${reportKey}/`,
            );

  publish:
    needs: validate-source
    if: |
      !cancelled() &&
      needs.validate-source.result == 'success' &&
      needs.validate-source.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: Report Publisher
    concurrency:
      group: vrt-${{ needs.validate-source.outputs.pull_number != '' && needs.validate-source.outputs.pull_number || needs.validate-source.outputs.baseline_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      report_has_diff: ${{ steps.regsuit.outcome == 'failure' }}
      report_deployed: ${{ steps.wait-deploy.outputs.deploy_status == 'success' }}
      changed_count: ${{ steps.vrt-counts.outputs.changed_count }}
      new_count: ${{ steps.vrt-counts.outputs.new_count }}
      deleted_count: ${{ steps.vrt-counts.outputs.deleted_count }}
      passed_count: ${{ steps.vrt-counts.outputs.passed_count }}
    steps:
      - name: Checkout trusted VRT publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted VRT publisher
        uses: ./.github/actions/setup
      - name: Download VRT screenshot data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: vrt-actual-*
          path: vrt-actual
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate VRT screenshot data
        run: node scripts/assertStaticArtifactSafety.mjs --profile vrt-screenshots --root vrt-actual
      - name: Scan VRT screenshot data
        run: node scripts/assertNoSensitiveArtifacts.mjs --root vrt-actual
      - name: Revalidate VRT source immediately before credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const eventRun = context.payload.workflow_run;
            const expectedWorkflowPath = '.github/workflows/vrt.yml';
            const baselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumberValue = process.env.EXPECTED_PULL_NUMBER ?? '';
            const reportKey = process.env.EXPECTED_REPORT_KEY ?? '';
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (
              !Number.isSafeInteger(eventRun.id) ||
              eventRun.id <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha)
            ) {
              core.setFailed('VRT source identity changed before credentials were enabled.');
              return;
            }

            const [{ data: trustedWorkflow }, { data: run }] = await Promise.all([
              github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'vrt.yml',
              }),
              github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: eventRun.id,
              }),
            ]);
            if (
              trustedWorkflow.path !== expectedWorkflowPath ||
              trustedWorkflow.state !== 'active' ||
              run.name !== 'VRT Artifact' ||
              run.workflow_id !== trustedWorkflow.id ||
              run.path !== expectedWorkflowPath ||
              run.head_sha !== expectedHeadSha ||
              run.run_attempt !== expectedRunAttempt ||
              run.status !== 'completed' ||
              run.conclusion !== 'success'
            ) {
              core.setFailed('VRT source run was superseded before credentials were enabled.');
              return;
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_branch === run.head_branch &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (pullNumberValue !== '' || candidate.head_branch === baselineRef),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== expectedRunAttempt) {
              core.setFailed('A newer VRT source run exists before credentials were enabled.');
              return;
            }

            if (pullNumberValue) {
              const pullNumber = Number(pullNumberValue);
              if (
                run.event !== 'pull_request' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !Number.isSafeInteger(pullNumber) ||
                pullNumber <= 0 ||
                run.pull_requests?.length !== 1 ||
                run.pull_requests[0]?.number !== pullNumber ||
                !['develop', 'main'].includes(baselineRef) ||
                reportKey !== `pr-${pullNumber}`
              ) {
                core.setFailed('VRT pull request source identity is invalid.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== baselineRef ||
                pullRequest.head.sha !== expectedHeadSha ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT source is no longer the current open pull request head.');
                return;
              }
            } else {
              if (
                run.event !== 'push' ||
                !['develop', 'main'].includes(baselineRef) ||
                run.head_branch !== baselineRef ||
                reportKey !== `branches/${baselineRef}`
              ) {
                core.setFailed('VRT branch source identity is invalid.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: baselineRef,
              });
              if (branch.commit.sha !== expectedHeadSha) {
                core.setFailed('VRT source is no longer the current branch head.');
                return;
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            const expectedNames = ['vrt-actual-1', 'vrt-actual-2', 'vrt-actual-3', 'vrt-actual-4'];
            const actualNames = available.map((artifact) => artifact.name).sort();
            const totalBytes = available.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            if (
              actualNames.length !== expectedNames.length ||
              actualNames.some((name, index) => name !== expectedNames[index]) ||
              available.some((artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 200 * 1024 * 1024) ||
              totalBytes > 500 * 1024 * 1024
            ) {
              core.setFailed('VRT artifact set changed before credentials were enabled.');
            }
      - name: Read VRT Pages without credentials
        run: git clone --depth 1 --single-branch https://github.com/yn1323/hosting-pages.git hosting-pages
      - name: Prepare trusted RegSuit baseline
        id: baseline
        env:
          BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
        run: |
          mkdir -p vrt-work/baseline
