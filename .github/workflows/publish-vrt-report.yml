name: Publish Trusted VRT Report

on:
  workflow_run:
    workflows: ["VRT Artifact"]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  VRT_REPORT_DIR: yps-crispy-carnival-vrt
  VRT_BASELINE_DIR: yps-crispy-carnival-vrt-baselines

jobs:
  comment-source-status:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-source-status-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR with VRT source status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-vrt-report:v1 -->';
            const heading = '## VRT Report';
            const run = context.payload.workflow_run;
            const action = context.payload.action;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;

            if (
              run.name !== 'VRT Artifact' ||
              run.event !== 'pull_request' ||
              !['in_progress', 'completed'].includes(action) ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0 ||
              !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
              run.pull_requests?.length !== 1
            ) {
              core.setFailed('Unexpected VRT source workflow metadata for PR status comment.');
              return;
            }
            if (action === 'completed' && typeof run.conclusion !== 'string') {
              core.setFailed('Completed VRT source workflow is missing its conclusion.');
              return;
            }

            const pullNumber = run.pull_requests[0]?.number;
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('VRT source workflow has an invalid pull request number.');
              return;
            }

            const sourceRunIsCurrent = async () => {
              const { data: liveRun } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const liveStatusMatches = action === 'in_progress'
                ? ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(liveRun.status) && liveRun.conclusion == null
                : liveRun.status === 'completed' && liveRun.conclusion === run.conclusion;
              if (
                liveRun.name !== run.name ||
                liveRun.workflow_id !== run.workflow_id ||
                liveRun.event !== run.event ||
                liveRun.head_sha !== run.head_sha ||
                liveRun.run_attempt !== run.run_attempt ||
                !liveStatusMatches
              ) {
                return false;
              }

              const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: run.event,
                head_sha: run.head_sha,
                per_page: 100,
              });
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === run.event &&
                  candidate.head_sha === run.head_sha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === pullNumber),
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return latestSourceRun?.id === run.id && latestSourceRun.run_attempt === run.run_attempt;
            };
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a superseded VRT source workflow status.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
              core.notice('Skipping a stale or closed VRT pull request status.');
              return;
            }
            if (
              !['develop', 'main'].includes(pullRequest.base.ref) ||
              pullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.setFailed('VRT status comment crosses an unexpected repository boundary.');
              return;
            }

            const conclusionLabels = {
              success: '比較完了（trusted reportの公開承認待ち）',
              failure: '失敗',
              cancelled: 'キャンセル',
              timed_out: 'タイムアウト',
              action_required: '要対応',
              skipped: 'スキップ',
              neutral: '完了（neutral）',
              stale: '期限切れ',
              startup_failure: '起動失敗',
            };
            const status = action === 'in_progress'
              ? '実行中（比較または承認待ち）'
              : (conclusionLabels[run.conclusion] ?? `完了（${run.conclusion}）`);
            const phase = action === 'in_progress' ? 1 : 2;
            const stateMarker = `<!-- shiftori-vrt-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              '',
              '| Action | Link |',
              '|---|---|',
              `| 実行確認 | [Actionsを見る](${actionsUrl}) |`,
              '',
              '差分レポートはtrusted publisherによる公開後、このコメントへ追加されます。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes(heading)),
            );
            const existingState = existing?.body?.match(
              /<!-- shiftori-vrt-state:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):([1-3]) -->/,
            );
            if (existingState?.[1] === run.head_sha) {
              const existingRunId = BigInt(existingState[2]);
              const existingAttempt = BigInt(existingState[3]);
              const existingPhase = Number(existingState[4]);
              if (
                existingRunId > BigInt(run.id) ||
                (existingRunId === BigInt(run.id) && existingAttempt > BigInt(run.run_attempt)) ||
                (
                  existingRunId === BigInt(run.id) &&
                  existingAttempt === BigInt(run.run_attempt) &&
                  existingPhase > phase
                )
              ) {
                core.notice('Skipping an older VRT source status comment update.');
                return;
              }
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (currentPullRequest.state !== 'open' || currentPullRequest.head.sha !== run.head_sha) {
              core.notice('Skipping a VRT status update after the pull request head changed.');
              return;
            }
            if (
              !['develop', 'main'].includes(currentPullRequest.base.ref) ||
              currentPullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.setFailed('VRT status target changed repository boundary before comment write.');
              return;
            }
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT status update after the source run changed.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }

  validate-source:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.source.outputs.should_publish }}
      pull_number: ${{ steps.source.outputs.pull_number }}
      report_key: ${{ steps.source.outputs.report_key }}
      baseline_ref: ${{ steps.source.outputs.baseline_ref }}
      should_update_baseline: ${{ steps.source.outputs.should_update_baseline }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      report_url: ${{ steps.source.outputs.report_url }}
    steps:
      - name: Validate source workflow metadata and artifact declarations
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            core.setOutput('should_publish', 'false');
            if (run.name !== 'VRT Artifact' || !['pull_request', 'push'].includes(run.event) || run.conclusion !== 'success') {
              core.setFailed('Unexpected VRT source workflow metadata.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) {
              core.setFailed('VRT source head SHA is invalid.');
              return;
            }
            if (
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(run.run_attempt) ||
              run.run_attempt <= 0
            ) {
              core.setFailed('VRT source run identity is invalid.');
              return;
            }

            let pullNumber = '';
            let reportKey;
            let baselineRef;
            let shouldUpdateBaseline = 'false';
            if (run.event === 'pull_request') {
              if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed('VRT report publishing is limited to same-repository pull requests.');
                return;
              }
              const pull = run.pull_requests?.[0];
              if (!pull || run.pull_requests.length !== 1) {
                core.setFailed('Exactly one pull request must be associated with VRT data.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
              });
              if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
                core.notice('Skipping a stale or closed VRT pull request run.');
                return;
              }
              if (
                !['develop', 'main'].includes(pullRequest.base.ref) ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT pull request crosses an unexpected repository boundary.');
                return;
              }
              pullNumber = String(pull.number);
              reportKey = `pr-${pull.number}`;
              baselineRef = pullRequest.base.ref;
            } else {
              if (!['develop', 'main'].includes(run.head_branch)) {
                core.setFailed('VRT push source must be develop or main.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: run.head_branch,
              });
              if (branch.commit.sha !== run.head_sha) {
                core.notice('Skipping a superseded VRT branch run.');
                return;
              }
              reportKey = `branches/${run.head_branch}`;
              baselineRef = run.head_branch;
              shouldUpdateBaseline = 'true';
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              head_sha: run.head_sha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === run.head_sha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (
                  run.event === 'pull_request'
                    ? candidate.pull_requests?.some((pull) => String(pull.number) === pullNumber)
                    : candidate.head_branch === baselineRef
                ),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== run.run_attempt) {
              core.notice('Skipping a superseded VRT source workflow run.');
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            const expectedNames = ['vrt-actual-1', 'vrt-actual-2', 'vrt-actual-3', 'vrt-actual-4'];
            const actualNames = available.map((artifact) => artifact.name).sort();
            const totalBytes = available.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            if (
              actualNames.length !== expectedNames.length ||
              actualNames.some((name, index) => name !== expectedNames[index]) ||
              available.some((artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 200 * 1024 * 1024) ||
              totalBytes > 500 * 1024 * 1024
            ) {
              core.setFailed('VRT artifact names, count, or declared sizes are invalid.');
              return;
            }

            core.setOutput('should_publish', 'true');
            core.setOutput('pull_number', pullNumber);
            core.setOutput('report_key', reportKey);
            core.setOutput('baseline_ref', baselineRef);
            core.setOutput('should_update_baseline', shouldUpdateBaseline);
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput(
              'report_url',
              `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/${reportKey}/`,
            );

  approve-pr-publication:
    needs: validate-source
    if: |
      needs.validate-source.outputs.should_publish == 'true' &&
      needs.validate-source.outputs.pull_number != ''
    runs-on: ubuntu-latest
    environment: vrt-approval
    permissions: {}
    steps:
      - name: Approve trusted VRT publication
        run: echo "Trusted VRT publication has been approved"

  publish:
    needs: [comment-source-status, validate-source, approve-pr-publication]
    if: |
      always() &&
      needs.validate-source.result == 'success' &&
      needs.validate-source.outputs.should_publish == 'true' &&
      (
        needs.validate-source.outputs.pull_number == '' ||
        needs.approve-pr-publication.result == 'success'
      )
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: vrt-${{ needs.validate-source.outputs.pull_number != '' && needs.validate-source.outputs.pull_number || needs.validate-source.outputs.baseline_ref }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      report_has_diff: ${{ steps.regsuit.outcome == 'failure' }}
      report_deployed: ${{ steps.wait-deploy.outputs.deploy_status == 'success' }}
    steps:
      - name: Checkout trusted VRT publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup trusted VRT publisher
        uses: ./.github/actions/setup
      - name: Download VRT screenshot data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: vrt-actual-*
          path: vrt-actual
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate VRT screenshot data
        run: node scripts/assertStaticArtifactSafety.mjs --profile vrt-screenshots --root vrt-actual
      - name: Scan VRT screenshot data
        run: node scripts/assertNoSensitiveArtifacts.mjs --root vrt-actual
      - name: Revalidate VRT source immediately before credentials
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const baselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumberValue = process.env.EXPECTED_PULL_NUMBER ?? '';
            const reportKey = process.env.EXPECTED_REPORT_KEY ?? '';
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (
              run.name !== 'VRT Artifact' ||
              run.conclusion !== 'success' ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              run.run_attempt !== expectedRunAttempt ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              run.head_sha !== expectedHeadSha
            ) {
              core.setFailed('VRT source identity changed before credentials were enabled.');
              return;
            }

            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            if (
              liveRun.name !== 'VRT Artifact' ||
              liveRun.workflow_id !== run.workflow_id ||
              liveRun.event !== run.event ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success'
            ) {
              core.setFailed('VRT source run was superseded before credentials were enabled.');
              return;
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (
                  pullNumberValue
                    ? candidate.pull_requests?.some((pull) => String(pull.number) === pullNumberValue)
                    : candidate.head_branch === baselineRef
                ),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== expectedRunAttempt) {
              core.setFailed('A newer VRT source run exists before credentials were enabled.');
              return;
            }

            if (pullNumberValue) {
              const pullNumber = Number(pullNumberValue);
              if (
                run.event !== 'pull_request' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !Number.isSafeInteger(pullNumber) ||
                pullNumber <= 0 ||
                run.pull_requests?.length !== 1 ||
                run.pull_requests[0]?.number !== pullNumber ||
                !['develop', 'main'].includes(baselineRef) ||
                reportKey !== `pr-${pullNumber}`
              ) {
                core.setFailed('VRT pull request source identity is invalid.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== baselineRef ||
                pullRequest.head.sha !== expectedHeadSha ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT source is no longer the current open pull request head.');
                return;
              }
            } else {
              if (
                run.event !== 'push' ||
                !['develop', 'main'].includes(baselineRef) ||
                run.head_branch !== baselineRef ||
                reportKey !== `branches/${baselineRef}`
              ) {
                core.setFailed('VRT branch source identity is invalid.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: baselineRef,
              });
              if (branch.commit.sha !== expectedHeadSha) {
                core.setFailed('VRT source is no longer the current branch head.');
                return;
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const available = artifacts.filter((artifact) => !artifact.expired);
            const expectedNames = ['vrt-actual-1', 'vrt-actual-2', 'vrt-actual-3', 'vrt-actual-4'];
            const actualNames = available.map((artifact) => artifact.name).sort();
            const totalBytes = available.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            if (
              actualNames.length !== expectedNames.length ||
              actualNames.some((name, index) => name !== expectedNames[index]) ||
              available.some((artifact) => artifact.size_in_bytes <= 0 || artifact.size_in_bytes > 200 * 1024 * 1024) ||
              totalBytes > 500 * 1024 * 1024
            ) {
              core.setFailed('VRT artifact set changed before credentials were enabled.');
            }
      - name: Checkout VRT Pages after data validation
        run: |
          git clone --depth 1 --single-branch \
            https://x-access-token:${{ secrets.HOSTING_PAGES_TOKEN }}@github.com/yn1323/hosting-pages.git \
            hosting-pages
      - name: Prepare trusted RegSuit baseline
        id: baseline
        run: |
          mkdir -p vrt-work/baseline
          if [ -d "hosting-pages/${{ env.VRT_BASELINE_DIR }}/${{ needs.validate-source.outputs.baseline_ref }}" ]; then
            cp -R "hosting-pages/${{ env.VRT_BASELINE_DIR }}/${{ needs.validate-source.outputs.baseline_ref }}/." vrt-work/baseline/
            node scripts/assertStaticArtifactSafety.mjs --profile vrt-screenshots --root vrt-work/baseline
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assert trusted VRT baseline
        if: ${{ needs.validate-source.outputs.pull_number != '' }}
        run: |
          if [ "${{ steps.baseline.outputs.found }}" != "true" ]; then
            echo "::error::VRT baseline is required for pull request publishing."
            exit 1
          fi
      - name: Build VRT report with trusted code
        run: pnpm vrt:report
        env:
          REG_SUIT_CLIENT_ID: ${{ secrets.REG_SUIT_CLIENT_ID }}
      - name: Read trusted VRT result
        id: regsuit
        if: ${{ steps.baseline.outputs.found == 'true' }}
        continue-on-error: true
        run: pnpm vrt:assert
      - name: Validate generated VRT report
        run: node scripts/assertStaticArtifactSafety.mjs --profile vrt-report --root vrt-work/reg
      - name: Scan generated VRT report
        run: node scripts/assertNoSensitiveArtifacts.mjs --root vrt-work/reg
      - name: Revalidate VRT source immediately before publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const baselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const pullNumberValue = process.env.EXPECTED_PULL_NUMBER ?? '';
            const reportKey = process.env.EXPECTED_REPORT_KEY ?? '';
            const expectedRunAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT ?? '');
            if (
              run.name !== 'VRT Artifact' ||
              run.conclusion !== 'success' ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(expectedRunAttempt) ||
              expectedRunAttempt <= 0 ||
              run.run_attempt !== expectedRunAttempt ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              run.head_sha !== expectedHeadSha
            ) {
              core.setFailed('VRT source identity changed before publication.');
              return;
            }

            const { data: liveRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            if (
              liveRun.name !== 'VRT Artifact' ||
              liveRun.workflow_id !== run.workflow_id ||
              liveRun.event !== run.event ||
              liveRun.head_sha !== expectedHeadSha ||
              liveRun.run_attempt !== expectedRunAttempt ||
              liveRun.status !== 'completed' ||
              liveRun.conclusion !== 'success'
            ) {
              core.setFailed('VRT source run was superseded before publication.');
              return;
            }

            const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
              event: run.event,
              head_sha: expectedHeadSha,
              per_page: 100,
            });
            const latestSourceRun = sourceRuns
              .filter((candidate) =>
                Number.isSafeInteger(candidate.id) &&
                candidate.id > 0 &&
                candidate.name === run.name &&
                candidate.workflow_id === run.workflow_id &&
                candidate.event === run.event &&
                candidate.head_sha === expectedHeadSha &&
                candidate.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (
                  pullNumberValue
                    ? candidate.pull_requests?.some((pull) => String(pull.number) === pullNumberValue)
                    : candidate.head_branch === baselineRef
                ),
              )
              .reduce(
                (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                undefined,
              );
            if (latestSourceRun?.id !== run.id || latestSourceRun.run_attempt !== expectedRunAttempt) {
              core.setFailed('A newer VRT source run exists before publication.');
              return;
            }

            if (pullNumberValue) {
              const pullNumber = Number(pullNumberValue);
              if (
                run.event !== 'pull_request' ||
                !Number.isSafeInteger(pullNumber) ||
                pullNumber <= 0 ||
                run.pull_requests?.length !== 1 ||
                run.pull_requests[0]?.number !== pullNumber ||
                reportKey !== `pr-${pullNumber}`
              ) {
                core.setFailed('VRT pull request source identity changed before publication.');
                return;
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== baselineRef ||
                pullRequest.head.sha !== expectedHeadSha ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
              ) {
                core.setFailed('VRT source is no longer the current open pull request head.');
                return;
              }
            } else {
              if (
                run.event !== 'push' ||
                !['develop', 'main'].includes(baselineRef) ||
                run.head_branch !== baselineRef ||
                reportKey !== `branches/${baselineRef}`
              ) {
                core.setFailed('VRT branch source identity changed before publication.');
                return;
              }
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: baselineRef,
              });
              if (branch.commit.sha !== expectedHeadSha) {
                core.setFailed('VRT source is no longer the current branch head.');
              }
            }
      - name: Publish trusted VRT report and baseline
        env:
          REPORT_KEY: ${{ needs.validate-source.outputs.report_key }}
          HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          SHOULD_UPDATE_BASELINE: ${{ needs.validate-source.outputs.should_update_baseline }}
        run: |
          set -euo pipefail
          if ! [[ "$REPORT_KEY" =~ ^(pr-[1-9][0-9]*|branches/(develop|main))$ ]]; then
            echo "::error::Unexpected VRT report key."
            exit 1
          fi

          REPORT_TARGET="hosting-pages/${VRT_REPORT_DIR}/${REPORT_KEY}"
          rm -rf "$REPORT_TARGET"
          mkdir -p "$REPORT_TARGET"
          cp -R vrt-work/reg/. "$REPORT_TARGET/"
          echo "${{ github.run_id }}-${{ github.run_attempt }}" > "$REPORT_TARGET/deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"

          if [ "$SHOULD_UPDATE_BASELINE" = "true" ]; then
            BASELINE_TARGET="hosting-pages/${VRT_BASELINE_DIR}/${REPORT_KEY#branches/}"
            rm -rf "$BASELINE_TARGET"
            mkdir -p "$BASELINE_TARGET"
            cp -R vrt-actual/. "$BASELINE_TARGET/"
          fi

          cd hosting-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "VRT report for ${REPORT_KEY} at ${HEAD_SHA}" || exit 0
          git pull --rebase
          git push origin HEAD:main
      - name: Wait for trusted VRT report deploy
        id: wait-deploy
        if: ${{ needs.validate-source.outputs.pull_number != '' }}
        env:
          REPORT_URL: ${{ needs.validate-source.outputs.report_url }}
        run: |
          MARKER_URL="${REPORT_URL}deploy-marker-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "${MARKER_URL}?t=$(date +%s)"; then
              echo "deploy_status=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Trusted VRT report deploy could not be confirmed within 15 minutes."
          exit 1
  comment-publication-result:
    needs: [comment-source-status, validate-source, approve-pr-publication, publish]
    if: |
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment PR with trusted VRT publication result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_BASELINE_REF: ${{ needs.validate-source.outputs.baseline_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-source.outputs.head_sha }}
          EXPECTED_PULL_NUMBER: ${{ needs.validate-source.outputs.pull_number }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.validate-source.outputs.run_attempt }}
          VALIDATION_RESULT: ${{ needs.validate-source.result }}
          SHOULD_PUBLISH: ${{ needs.validate-source.outputs.should_publish }}
          APPROVAL_RESULT: ${{ needs.approve-pr-publication.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REPORT_DEPLOYED: ${{ needs.publish.outputs.report_deployed }}
          HAS_DIFF: ${{ needs.publish.outputs.report_has_diff }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPORT_URL: ${{ needs.validate-source.outputs.report_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- shiftori-vrt-report:v1 -->';
            const heading = '## VRT Report';
            const run = context.payload.workflow_run;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const outputBaselineRef = process.env.EXPECTED_BASELINE_REF ?? '';
            const outputHeadSha = process.env.EXPECTED_HEAD_SHA ?? '';
            const outputIssueNumber = Number(process.env.EXPECTED_PULL_NUMBER ?? '');
            const outputSourceRunAttempt = Number(process.env.EXPECTED_SOURCE_RUN_ATTEMPT ?? '');
            const validationResult = process.env.VALIDATION_RESULT ?? '';
            const shouldPublish = process.env.SHOULD_PUBLISH ?? '';
            const approvalResult = process.env.APPROVAL_RESULT ?? '';
            const publishResult = process.env.PUBLISH_RESULT ?? '';
            const reportDeployed = process.env.REPORT_DEPLOYED ?? '';
            const hasDiffValue = process.env.HAS_DIFF ?? '';
            const publishRunAttempt = process.env.PUBLISH_RUN_ATTEMPT ?? '';
            const reportBaseUrl = process.env.REPORT_URL ?? '';
            const allowedJobResults = ['success', 'failure', 'cancelled', 'skipped'];
            const expectedHeadSha = run.head_sha ?? '';
            const issueNumber = run.pull_requests?.[0]?.number;
            const expectedSourceRunAttempt = run.run_attempt;
            const validationSucceeded = validationResult === 'success' && shouldPublish === 'true';
            if (
              run.name !== 'VRT Artifact' ||
              run.event !== 'pull_request' ||
              run.conclusion !== 'success' ||
              run.head_repository?.full_name !== expectedRepository ||
              !Number.isSafeInteger(run.id) ||
              run.id <= 0 ||
              !Number.isSafeInteger(run.workflow_id) ||
              run.workflow_id <= 0 ||
              !Number.isSafeInteger(expectedSourceRunAttempt) ||
              expectedSourceRunAttempt <= 0 ||
              run.run_attempt !== expectedSourceRunAttempt ||
              run.pull_requests?.length !== 1 ||
              run.pull_requests[0]?.number !== issueNumber ||
              !Number.isSafeInteger(issueNumber) ||
              issueNumber <= 0 ||
              !/^[0-9a-f]{40}$/.test(expectedHeadSha) ||
              !/^[1-9][0-9]*$/.test(publishRunAttempt) ||
              !allowedJobResults.includes(validationResult) ||
              !['', 'true', 'false'].includes(shouldPublish) ||
              !allowedJobResults.includes(approvalResult) ||
              !allowedJobResults.includes(publishResult) ||
              !['', 'true', 'false'].includes(reportDeployed) ||
              !['', 'true', 'false'].includes(hasDiffValue)
            ) {
              core.setFailed('VRT source identity is invalid at comment time.');
              return;
            }
            if (
              validationSucceeded &&
              (
                outputBaselineRef === '' ||
                outputHeadSha !== expectedHeadSha ||
                outputIssueNumber !== issueNumber ||
                outputSourceRunAttempt !== expectedSourceRunAttempt ||
                reportBaseUrl !== `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/pr-${issueNumber}/`
              )
            ) {
              core.setFailed('Validated VRT outputs changed before the terminal comment.');
              return;
            }

            const sourceRunIsCurrent = async () => {
              const { data: liveRun } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              if (
                liveRun.name !== 'VRT Artifact' ||
                liveRun.workflow_id !== run.workflow_id ||
                liveRun.event !== 'pull_request' ||
                liveRun.head_sha !== expectedHeadSha ||
                liveRun.run_attempt !== expectedSourceRunAttempt ||
                liveRun.status !== 'completed' ||
                liveRun.conclusion !== 'success'
              ) {
                return false;
              }

              const sourceRuns = await github.paginate(github.rest.actions.listWorkflowRunsForWorkflow, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                event: run.event,
                head_sha: expectedHeadSha,
                per_page: 100,
              });
              const latestSourceRun = sourceRuns
                .filter((candidate) =>
                  Number.isSafeInteger(candidate.id) &&
                  candidate.id > 0 &&
                  candidate.name === run.name &&
                  candidate.workflow_id === run.workflow_id &&
                  candidate.event === run.event &&
                  candidate.head_sha === expectedHeadSha &&
                  candidate.head_repository?.full_name === expectedRepository &&
                  candidate.pull_requests?.some((pull) => pull.number === issueNumber),
                )
                .reduce(
                  (latest, candidate) => (!latest || candidate.id > latest.id ? candidate : latest),
                  undefined,
                );
              return latestSourceRun?.id === run.id && latestSourceRun.run_attempt === expectedSourceRunAttempt;
            };
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT result comment from a superseded source run.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            const baselineRef = pullRequest.base?.ref;
            if (
              pullRequest.state !== 'open' ||
              !['develop', 'main'].includes(baselineRef) ||
              pullRequest.head.sha !== expectedHeadSha ||
              pullRequest.head.repo?.full_name !== expectedRepository ||
              (validationSucceeded && baselineRef !== outputBaselineRef)
            ) {
              core.notice('Skipping a stale or closed VRT result comment.');
              return;
            }

            const publicationSucceeded =
              validationSucceeded &&
              approvalResult === 'success' &&
              publishResult === 'success' &&
              reportDeployed === 'true';
            const hasDiff = hasDiffValue === 'true';
            const reportUrl = `${reportBaseUrl}?v=${context.runId}-${publishRunAttempt}`;
            const status = !validationSucceeded
              ? `Trusted report検証失敗（${validationResult}）`
              : approvalResult !== 'success'
                ? `公開承認未完了（${approvalResult}）`
                : publicationSucceeded
                  ? (hasDiff ? 'Trusted publication approved; differences published' : 'Passed')
                  : `Trusted report公開失敗（${publishResult}）`;
            const phase = 3;
            const stateMarker = `<!-- shiftori-vrt-state:${run.head_sha}:${run.id}:${run.run_attempt}:${phase} -->`;
            const body = [
              marker,
              stateMarker,
              heading,
              '',
              `Status: ${status}`,
              '',
              '| Action | Link |',
              '|---|---|',
              ...(publicationSucceeded ? [`| 差分確認 | [差分レポートを見る](${reportUrl}) |`] : []),
              `| 実行確認 | [Actionsを見る](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = [...comments].reverse().find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes(heading)),
            );
            const existingState = existing?.body?.match(
              /<!-- shiftori-vrt-state:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):([1-3]) -->/,
            );
            if (existingState?.[1] === run.head_sha) {
              const existingRunId = BigInt(existingState[2]);
              const existingAttempt = BigInt(existingState[3]);
              const existingPhase = Number(existingState[4]);
              if (
                existingRunId > BigInt(run.id) ||
                (existingRunId === BigInt(run.id) && existingAttempt > BigInt(run.run_attempt)) ||
                (
                  existingRunId === BigInt(run.id) &&
                  existingAttempt === BigInt(run.run_attempt) &&
                  existingPhase > phase
                )
              ) {
                core.notice('Skipping an older VRT result comment update.');
                return;
              }
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            if (
              currentPullRequest.state !== 'open' ||
              currentPullRequest.base.ref !== baselineRef ||
              currentPullRequest.head.sha !== expectedHeadSha ||
              currentPullRequest.head.repo?.full_name !== expectedRepository
            ) {
              core.notice('Skipping a VRT result update after the pull request head changed.');
              return;
            }
            if (!(await sourceRunIsCurrent())) {
              core.notice('Skipping a VRT result update after the source run changed.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
