name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      mentioned: ${{ steps.authorization.outputs.mentioned }}
      actor: ${{ steps.authorization.outputs.actor }}
    steps:
      - name: Authorize the original event sender
        id: authorization
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const sender = context.payload.sender?.login ?? '';
            const senderPattern = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/;
            const bodies = context.eventName === 'issue_comment'
              ? [context.payload.comment?.body]
              : context.eventName === 'pull_request_review_comment'
                ? [context.payload.comment?.body]
                : context.eventName === 'pull_request_review'
                  ? [context.payload.review?.body]
                  : context.eventName === 'issues'
                    ? [context.payload.issue?.title, context.payload.issue?.body]
                    : [];
            const mentioned = bodies.some((value) => typeof value === 'string' && value.includes('@claude'));
            let permission = 'none';

            if (mentioned && senderPattern.test(sender)) {
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: sender,
                });
                permission = response.data.permission ?? 'none';
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const authorized = mentioned && ['admin', 'maintain', 'write'].includes(permission);
            core.setOutput('authorized', authorized ? 'true' : 'false');
            core.setOutput('mentioned', mentioned ? 'true' : 'false');
            core.setOutput('actor', senderPattern.test(sender) ? sender : 'invalid');
            await core.summary
              .addHeading('Claude invocation authorization')
              .addTable([
                [{ data: 'Event', header: true }, context.eventName],
                [{ data: 'Actor', header: true }, senderPattern.test(sender) ? sender : 'invalid'],
                [{ data: 'Permission', header: true }, permission],
                [{ data: 'Authorized', header: true }, authorized ? 'yes' : 'no'],
              ])
              .write();

  claude:
    needs: authorize
    if: needs.authorize.outputs.mentioned == 'true' && needs.authorize.outputs.authorized == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@b76a0776ae74036e77cd11018083743453d7ad35 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 10
