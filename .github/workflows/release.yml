name: Release to Production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch'))
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Determine release type
        id: release-type
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_TAG=$(npm version ${{ steps.release-type.outputs.type }} --no-git-tag-version)
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Commit release
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"

      - name: Record release build metadata
        run: echo "VITE_RELEASE_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Stripeを含む公開artifactのBuildを先に完了し、失敗時はtag、deploymentを変更しない。
      - name: Build
        run: pnpm build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_STANDARD_PRICE_ID: ${{ secrets.STRIPE_STANDARD_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          VITE_APP_ENVIRONMENT: production
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_COMMERCIAL_TRANSACTIONS_ADDRESS: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_ADDRESS }}
          VITE_COMMERCIAL_TRANSACTIONS_NAME: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_NAME }}
          VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER: ${{ vars.VITE_COMMERCIAL_TRANSACTIONS_PHONE_NUMBER }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_WEB_VITALS_SAMPLE_RATE: ${{ vars.VITE_WEB_VITALS_SAMPLE_RATE }}

      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Run Convex migrations
        run: npx convex run migrations/index:run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist/client \
            --project-name shiftori \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # すべてのProduction deployment成功後に、release commitとtagを同時に公開する。
      - name: Tag and push
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true

  sync-version-to-develop:
    if: needs.release.result == 'success'
    needs: release
    uses: ./.github/workflows/sync-release-version-to-develop.yml
    secrets:
      RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
