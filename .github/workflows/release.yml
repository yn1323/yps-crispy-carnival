name: Release to Production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:major') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:patch'))
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify provider canary approval
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate --slurp > provider-canary-comments.json
          node -e 'const fs = require("fs"); const labels = JSON.parse(process.env.PR_LABELS_JSON || "[]"); const required = "release:provider-canary-passed"; const marker = `<!-- shiftori-provider-canary:${process.env.EXPECTED_HEAD_SHA} -->`; const verified = "<!-- shiftori-provider-canary-verified:v1 -->"; const comments = JSON.parse(fs.readFileSync("provider-canary-comments.json", "utf8")).flat(); const recordedByWorkflow = comments.some((comment) => comment.user?.login === "github-actions[bot]" && comment.body.includes(marker) && comment.body.includes(verified)); if (!labels.includes(required) || !recordedByWorkflow) { console.error(`Missing verified provider canary approval for head ${process.env.EXPECTED_HEAD_SHA}`); process.exit(1); }'

      - name: Determine release type
        id: release-type
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_TAG=$(npm version ${{ steps.release-type.outputs.type }} --no-git-tag-version)
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        run: |
          git add package.json
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin main --follow-tags

      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Run Convex migrations
        run: npx convex run migrations/index:run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build
        run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # prerender.ts launches Chromium; this is not an E2E test step.
      - name: Setup prerender browser
        uses: ./.github/actions/playwright

      - name: Prerender static routes
        run: pnpm prerender

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name shiftori \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
