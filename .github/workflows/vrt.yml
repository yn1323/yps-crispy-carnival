name: vrt

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VRT_REPORT_DIR: yps-crispy-carnival-vrt
  VRT_BASELINE_DIR: yps-crispy-carnival-vrt-baselines
  # Storybookでは外部サービスをモックするため、公開設定は決定的なテスト値を使う。
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_storybook
  VITE_CONVEX_URL: https://storybook.convex.cloud

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_number: ${{ steps.destination.outputs.pull_number }}
      report_key: ${{ steps.destination.outputs.report_key }}
      baseline_ref: ${{ steps.destination.outputs.baseline_ref }}
      report_url: ${{ steps.destination.outputs.report_url }}
      should_update_baseline: ${{ steps.destination.outputs.should_update_baseline }}
      should_fail_on_diff: ${{ steps.destination.outputs.should_fail_on_diff }}
      source_branch: ${{ steps.destination.outputs.source_branch }}
      source_sha: ${{ steps.destination.outputs.source_sha }}
      trusted: ${{ steps.destination.outputs.trusted }}
    steps:
      - name: Resolve VRT destination
        id: destination
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventPull = context.payload.pull_request;
            const branch = eventPull?.head?.ref ?? context.ref.replace('refs/heads/', '');
            const branchSlug = branch.replace(/[^A-Za-z0-9._-]/g, '-');
            const isBasePush = !eventPull && (branch === 'develop' || branch === 'main');
            let pull = eventPull;

            if (!pull && !isBasePush) {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open',
                per_page: 1,
              });
              pull = pulls[0];
            }

            const reportKey = pull ? `pr-${pull.number}` : `branches/${branchSlug}`;
            const baselineRef = pull?.base?.ref ?? (branch === 'main' ? 'main' : 'develop');
            const trusted = !eventPull || eventPull.head.repo.full_name === `${owner}/${repo}`;

            core.setOutput('pull_number', pull?.number ?? '');
            core.setOutput('report_key', reportKey);
            core.setOutput('baseline_ref', baselineRef);
            core.setOutput('should_update_baseline', isBasePush ? 'true' : 'false');
            core.setOutput('should_fail_on_diff', isBasePush ? 'false' : 'true');
            core.setOutput('source_branch', branch);
            core.setOutput('source_sha', eventPull?.head?.sha ?? context.sha);
            core.setOutput('trusted', trusted ? 'true' : 'false');
            core.setOutput(
              'report_url',
              `https://yn1323.github.io/hosting-pages/${process.env.VRT_REPORT_DIR}/${reportKey}/`,
            );

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Storybook Build
        run: pnpm vrt:build

  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          rm -rf "$HOME/.cache/fontconfig"
          mkdir -p "$HOME/.cache/fontconfig"
          fc-cache -f -v
          fc-match sans-serif
          fc-match ":lang=ja"
      - name: Capture VRT screenshots
        run: pnpm vrt:capture:shard --shard=${{ matrix.shard }}/4
      - name: Upload VRT screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrt-actual-${{ matrix.shard }}
          path: vrt-actual/
          if-no-files-found: error
          retention-days: 3

  compare:
    needs:
      - prepare
      - build
      - capture
    if: needs.prepare.outputs.trusted == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: Preview
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      has_diff: ${{ steps.diff_check.outputs.has_diff }}
      publish_status: ${{ steps.publish.outputs.status }}
    env:
      REG_SUIT_CLIENT_ID: ${{ secrets.REG_SUIT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Checkout hosted VRT snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: yn1323/hosting-pages
          ref: yps-reports
          path: hosting-pages
          token: ${{ secrets.HOSTING_PAGES_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ${{ env.VRT_BASELINE_DIR }}/${{ needs.prepare.outputs.baseline_ref }}
            ${{ env.VRT_REPORT_DIR }}/${{ needs.prepare.outputs.report_key }}
      - name: Download VRT screenshots
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: vrt-actual-*
          path: vrt-actual
          merge-multiple: true
      - name: Prepare RegSuit baseline
        id: baseline
        env:
          BASELINE_REF: ${{ needs.prepare.outputs.baseline_ref }}
        run: |
          mkdir -p vrt-work/baseline
          if [ -d "hosting-pages/${VRT_BASELINE_DIR}/${BASELINE_REF}" ]; then
            cp -R "hosting-pages/${VRT_BASELINE_DIR}/${BASELINE_REF}/." vrt-work/baseline/
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build VRT report
        run: pnpm vrt:report
        env:
          REGSUIT_REQUIRE_BASELINE: ${{ needs.prepare.outputs.should_fail_on_diff }}
      - name: Assert VRT result
        id: regsuit
        if: ${{ steps.baseline.outputs.found == 'true' }}
        continue-on-error: true
        run: pnpm vrt:assert
      - name: Publish VRT report snapshot
        id: publish
        if: ${{ !cancelled() && hashFiles('vrt-work/reg/index.html') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOSTING_PAGES_TOKEN: ${{ secrets.HOSTING_PAGES_TOKEN }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
          REPORT_KEY: ${{ needs.prepare.outputs.report_key }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SHOULD_UPDATE_BASELINE: ${{ needs.prepare.outputs.should_update_baseline }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          ARGS=(
            --repository hosting-pages
            --source vrt-work/reg
            --target "${VRT_REPORT_DIR}/${REPORT_KEY}"
            --report-type vrt
            --source-sha "${SOURCE_SHA}"
            --run-id "${RUN_ID}"
            --run-attempt "${RUN_ATTEMPT}"
          )
          if [ "${PULL_NUMBER}" != "" ]; then
            ARGS+=(--pull-request "${PULL_NUMBER}")
          else
            ARGS+=(--source-branch "${SOURCE_BRANCH}")
          fi
          if [ "${SHOULD_UPDATE_BASELINE}" = "true" ]; then
            ARGS+=(
              --baseline-source vrt-actual
              --baseline-target "${VRT_BASELINE_DIR}/${SOURCE_BRANCH}"
            )
          fi
          node scripts/publishHostingReport.mjs "${ARGS[@]}"
      - name: Build VRT report comment
        if: ${{ !cancelled() && needs.prepare.outputs.pull_number != '' && (steps.publish.outputs.status == 'published' || steps.publish.outputs.status == 'noop') }}
        env:
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          COMPARE_RESULT: ${{ steps.regsuit.outcome }}
          REPORT_URL: ${{ needs.prepare.outputs.report_url }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          node <<'NODE'
            const fs = require("node:fs");
            const reportUrl = process.env.REPORT_URL;
            const baselineFound = process.env.BASELINE_FOUND === 'true';
            const compareResult = baselineFound ? process.env.COMPARE_RESULT : 'success';
            const statusText = baselineFound ? (compareResult === 'success' ? 'Passed' : 'Failed') : 'No baseline';

            let changedCount = 'unknown';
            let newCount = 'unknown';
            let deletedCount = 'unknown';
            let passedCount = 'unknown';
            try {
              const json = JSON.parse(fs.readFileSync('vrt-work/reg/out.json', 'utf8'));
              const items = json.failedItems || json.changedItems || json.items || [];
              const newItems = json.newItems || [];
              const deletedItems = json.deletedItems || [];
              const passedItems = json.passedItems || [];
              changedCount = String(items.length);
              newCount = String(newItems.length);
              deletedCount = String(deletedItems.length);
              passedCount = String(passedItems.length);
            } catch (error) {
              console.warn('RegSuit result JSON の読み込みに失敗しました', error);
            }

            const actionsUrl = process.env.ACTIONS_URL;
            const hasDiff = compareResult !== 'success' && baselineFound;
            const buildBody = (reportCell) => {
              const actionRows = [
                `| 差分確認 | ${reportCell} |`,
                ...(hasDiff ? [`| 承認 | [承認ワークフローを開く](${actionsUrl}) |`] : []),
              ].join('\n');

              return [
                '## VRT Report',
                '',
                `Status: ${statusText}`,
                `差分: Changed ${changedCount} / New ${newCount} / Deleted ${deletedCount}`,
                `Passed: ${passedCount}`,
                `Head SHA: ${process.env.SOURCE_SHA}`,
                `Run: ${process.env.RUN_ID} (attempt ${process.env.RUN_ATTEMPT})`,
                '',
                '| Action | Link |',
                '|---|---|',
                actionRows,
                '',
                'Details:',
                'デプロイ先: [yn1323/hosting-pages:yps-reports](https://github.com/yn1323/hosting-pages/commits/yps-reports/)',
                '',
              ].join('\n');
            };

            fs.writeFileSync('vrt-comment-pending.md', buildBody('レポートをデプロイ中です…'));
            fs.writeFileSync(
              'vrt-comment-final.md',
              buildBody(`[差分レポートを見る](${reportUrl}?v=${process.env.RUN_ID}-${process.env.RUN_ATTEMPT})`),
            );
          NODE
          cat vrt-comment-final.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR while VRT report is deploying
        id: report_comment
        if: ${{ !cancelled() && hashFiles('vrt-comment-pending.md') != '' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '## VRT Report';
            const issue_number = Number(process.env.PULL_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: fs.readFileSync('vrt-comment-pending.md', 'utf8'),
            });
            core.setOutput('comment_id', String(comment.id));
      - name: Wait for hosted VRT report
        id: wait_deploy
        if: ${{ !cancelled() && (steps.publish.outputs.status == 'published' || steps.publish.outputs.status == 'noop') }}
        env:
          MARKER_NAME: ${{ steps.publish.outputs.marker_name }}
          REPORT_URL: ${{ needs.prepare.outputs.report_url }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER_URL="${REPORT_URL}${MARKER_NAME}"
          EXPECTED="${RUN_ID}-${RUN_ATTEMPT}"
          for i in $(seq 1 90); do
            VALUE="$(curl -fsSL "${MARKER_URL}?t=$(date +%s)" || true)"
            if [ "${VALUE}" = "${EXPECTED}" ]; then
              echo "deploy_status=success" >> "$GITHUB_OUTPUT"
              echo "Deploy confirmed after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "deploy_status=timeout" >> "$GITHUB_OUTPUT"
      - name: Update PR comment with VRT report
        if: ${{ always() && steps.report_comment.outputs.comment_id != '' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_ID: ${{ steps.report_comment.outputs.comment_id }}
          DEPLOY_STATUS: ${{ steps.wait_deploy.outputs.deploy_status }}
        with:
          script: |
            const fs = require('node:fs');
            let body = fs.readFileSync('vrt-comment-final.md', 'utf8');
            if (process.env.DEPLOY_STATUS !== 'success') {
              body += '\n\n> ⚠️ レポートの公開確認がタイムアウトしました。差分結果はActionsログとartifactを確認してください。';
            }
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body,
            });
      - name: Warn when VRT report is unavailable
        if: ${{ always() && (steps.publish.outputs.status == 'published' || steps.publish.outputs.status == 'noop') && steps.wait_deploy.outputs.deploy_status != 'success' }}
        run: |
          echo "::warning::hosting-pages deploy could not be confirmed within 15 minutes; VRT comparison and artifact checks remain authoritative"
      - name: Set diff output
        id: diff_check
        if: always()
        env:
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
          REGSUIT_OUTCOME: ${{ steps.regsuit.outcome }}
        run: |
          if [[ "${BASELINE_FOUND}" == "true" && "${REGSUIT_OUTCOME}" == "failure" && ( "${PUBLISH_STATUS}" == "published" || "${PUBLISH_STATUS}" == "noop" ) ]]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

  approve:
    needs: [prepare, compare]
    if: |
      always() &&
      needs.compare.result == 'success' &&
      needs.prepare.outputs.should_fail_on_diff == 'true' &&
      (needs.compare.outputs.publish_status == 'published' || needs.compare.outputs.publish_status == 'noop') &&
      needs.compare.outputs.has_diff == 'true'
    environment: vrt-approval
    runs-on: ubuntu-latest
    steps:
      - name: VRT diffs approved
        run: echo "Visual regression diffs have been reviewed and approved"
