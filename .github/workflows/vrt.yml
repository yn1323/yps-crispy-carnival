name: VRT Artifact

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vrt-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  VRT_REPORT_DIR: yps-crispy-carnival-vrt
  VRT_BASELINE_DIR: yps-crispy-carnival-vrt-baselines
  # Storybookでは外部サービスをモックするため、公開設定は決定的なテスト値を使う。
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_storybook
  VITE_CONVEX_URL: https://storybook.convex.cloud

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pull_number: ${{ steps.destination.outputs.pull_number }}
      baseline_ref: ${{ steps.destination.outputs.baseline_ref }}
      should_fail_on_diff: ${{ steps.destination.outputs.should_fail_on_diff }}
    steps:
      - name: Resolve VRT comparison target
        id: destination
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const branch = pull?.head?.ref ?? context.ref.replace('refs/heads/', '');
            const baselineRef = pull?.base?.ref ?? branch;
            if (!['develop', 'main'].includes(baselineRef)) {
              core.setFailed('VRT baseline must be develop or main.');
              return;
            }
            core.setOutput('pull_number', pull?.number ?? '');
            core.setOutput('baseline_ref', baselineRef);
            core.setOutput('should_fail_on_diff', pull ? 'true' : 'false');

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Storybook Build
        run: pnpm vrt:build

  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          rm -rf "$HOME/.cache/fontconfig"
          mkdir -p "$HOME/.cache/fontconfig"
          fc-cache -f -v
          fc-match sans-serif
          fc-match ":lang=ja"
      - name: Capture VRT screenshots
        run: pnpm vrt:capture:shard --shard=${{ matrix.shard }}/4
      - name: Upload VRT screenshot data
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrt-actual-${{ matrix.shard }}
          path: vrt-actual/
          if-no-files-found: error
          retention-days: 3

  compare:
    needs: [prepare, build, capture]
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.diff-check.outputs.has_diff }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Read published VRT baseline without credentials
        run: git clone --depth 1 --single-branch https://github.com/yn1323/hosting-pages.git hosting-pages
      - name: Download VRT screenshot data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: vrt-actual-*
          path: vrt-actual
          merge-multiple: true
      - name: Validate VRT screenshot data
        run: node scripts/assertStaticArtifactSafety.mjs --profile vrt-screenshots --root vrt-actual
      - name: Prepare RegSuit baseline
        id: baseline
        run: |
          mkdir -p vrt-work/baseline
          if [ -d "hosting-pages/${{ env.VRT_BASELINE_DIR }}/${{ needs.prepare.outputs.baseline_ref }}" ]; then
            cp -R "hosting-pages/${{ env.VRT_BASELINE_DIR }}/${{ needs.prepare.outputs.baseline_ref }}/." vrt-work/baseline/
            node scripts/assertStaticArtifactSafety.mjs --profile vrt-screenshots --root vrt-work/baseline
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assert VRT baseline
        run: |
          if [ "${{ needs.prepare.outputs.should_fail_on_diff }}" = "true" ] && [ "${{ steps.baseline.outputs.found }}" != "true" ]; then
            echo "::error::VRT baseline is required for pull requests targeting ${{ needs.prepare.outputs.baseline_ref }}."
            exit 1
          fi
      - name: Build credential-free VRT comparison
        run: |
          pnpm exec tsx scripts/prepareRegSuitBaseline.ts
          pnpm exec reg-suit compare -c regconfig.artifact.json
      - name: Assert VRT result
        id: regsuit
        if: ${{ steps.baseline.outputs.found == 'true' }}
        continue-on-error: true
        run: pnpm vrt:assert
      - name: Set diff output
        id: diff-check
        if: always()
        run: |
          if [[ "${{ steps.baseline.outputs.found }}" == "true" && "${{ steps.regsuit.outcome }}" == "failure" ]]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

  approve:
    needs: [prepare, compare]
    if: |
      always() &&
      needs.compare.result == 'success' &&
      needs.prepare.outputs.should_fail_on_diff == 'true' &&
      needs.compare.outputs.has_diff == 'true'
    environment: vrt-approval
    runs-on: ubuntu-latest
    steps:
      - name: VRT source diffs approved for merge
        run: echo "Source VRT differences have been reviewed for the pull request merge gate"
