name: vrt

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Storybookでは外部サービスをモックするため、公開設定は決定的なテスト値を使う。
  VITE_CLERK_PUBLISHABLE_KEY: pk_test_storybook
  VITE_CONVEX_URL: https://storybook.convex.cloud

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      baseline_ref: ${{ steps.destination.outputs.baseline_ref }}
      should_update_baseline: ${{ steps.destination.outputs.should_update_baseline }}
      should_fail_on_diff: ${{ steps.destination.outputs.should_fail_on_diff }}
      trusted: ${{ steps.destination.outputs.trusted }}
    steps:
      - name: Resolve VRT destination
        id: destination
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const branch = context.ref.replace('refs/heads/', '');
            const isBasePush = context.eventName === 'push' && ['develop', 'main'].includes(branch);
            const trusted = pull
              ? pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`
              : isBasePush;
            const baselineRef = pull?.base?.ref ?? branch;
            if (!['develop', 'main'].includes(baselineRef)) {
              throw new Error('Unsupported VRT baseline branch.');
            }
            core.setOutput('baseline_ref', baselineRef);
            core.setOutput('should_update_baseline', String(isBasePush));
            core.setOutput('should_fail_on_diff', String(!isBasePush));
            core.setOutput('trusted', String(trusted));

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: vrt-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Storybook Build
        run: pnpm vrt:build

  capture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: vrt-capture-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/playwright
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          rm -rf "$HOME/.cache/fontconfig"
          mkdir -p "$HOME/.cache/fontconfig"
          fc-cache -f -v
          fc-match sans-serif
          fc-match ":lang=ja"
      - name: Capture VRT screenshots
        run: pnpm vrt:capture:shard --shard=${{ matrix.shard }}/4
      - name: Upload VRT screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrt-actual-${{ github.run_attempt }}-${{ matrix.shard }}
          path: vrt-actual/
          if-no-files-found: error
          retention-days: 3

  compare:
    needs: [prepare, build, capture]
    if: needs.prepare.outputs.trusted == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: vrt-compare-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    outputs:
      has_diff: ${{ steps.diff_check.outputs.has_diff }}
      capture_artifact_ids: ${{ steps.capture_artifacts.outputs.ids }}
    env:
      REG_SUIT_CLIENT_ID: ${{ secrets.REG_SUIT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Verify all VRT capture artifacts
        id: capture_artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const ids = [1, 2, 3, 4].map((shard) => {
              const name = `vrt-actual-${process.env.RUN_ATTEMPT}-${shard}`;
              const matches = artifacts.filter((artifact) => artifact.name === name && !artifact.expired);
              if (matches.length !== 1) {
                throw new Error(`Missing or duplicate current-attempt capture shard ${shard}; rerun all jobs.`);
              }
              return matches[0].id;
            });
            core.setOutput('ids', ids.join(','));
      - name: Download VRT screenshots
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ steps.capture_artifacts.outputs.ids }}
          path: vrt-actual
          merge-multiple: true
      - name: Download public VRT baseline
        env:
          BASELINE_REF: ${{ needs.prepare.outputs.baseline_ref }}
          REPORT_PUBLIC_BASE_URL: ${{ vars.REPORT_PUBLIC_BASE_URL }}
        run: >-
          node scripts/hostedReportBaseline.mjs download
          --base-url "$REPORT_PUBLIC_BASE_URL"
          --branch "$BASELINE_REF"
          --destination vrt-work/baseline
      - name: Build VRT report
        run: pnpm vrt:report
        env:
          REGSUIT_REQUIRE_BASELINE: 'true'
      - name: Assert VRT result
        id: regsuit
        continue-on-error: true
        run: pnpm vrt:assert
      - name: Set diff output
        id: diff_check
        env:
          REGSUIT_OUTCOME: ${{ steps.regsuit.outcome }}
        run: |
          if [ "$REGSUIT_OUTCOME" = 'failure' ]; then
            echo 'has_diff=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_diff=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload complete VRT report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrt-report-${{ github.run_attempt }}
          path: vrt-work/reg/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, compare]
    if: needs.prepare.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: hosted-reports-r2-write
      cancel-in-progress: false
      queue: max
    outputs:
      status: ${{ steps.publish.outputs.status }}
      report_url: ${{ steps.publish.outputs.report_url }}
    steps:
      # 公開資格情報を渡すのは、レビュー済みcommitのscriptだけに限定する。
      - name: Checkout trusted report publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 6654d56797f20b6e55ca0adb47d9bdfa591b0308
          path: trusted-tools
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install trusted report dependencies
        working-directory: trusted-tools
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Download complete VRT report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vrt-report-${{ github.run_attempt }}
          path: report-input
      - name: Download baseline source images
        if: needs.prepare.outputs.should_update_baseline == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.compare.outputs.capture_artifact_ids }}
          path: baseline-input
          merge-multiple: true
      - name: Prepare public VRT report
        id: prepare_report
        working-directory: trusted-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOULD_UPDATE_BASELINE: ${{ needs.prepare.outputs.should_update_baseline }}
        run: |
          ARGS=(--type vrt --source ../report-input --output ../prepared-report)
          if [ "$SHOULD_UPDATE_BASELINE" = 'true' ]; then
            ARGS+=(--baseline-source ../baseline-input)
          fi
          node scripts/hostedReportCi.mjs prepare "${ARGS[@]}"
      - name: Publish VRT report to R2
        if: steps.prepare_report.outputs.status == 'prepared'
        id: publish
        working-directory: trusted-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_R2_ACCESS_KEY_ID: ${{ secrets.REPORT_R2_ACCESS_KEY_ID }}
          REPORT_R2_SECRET_ACCESS_KEY: ${{ secrets.REPORT_R2_SECRET_ACCESS_KEY }}
          REPORT_R2_ENDPOINT: ${{ vars.REPORT_R2_ENDPOINT }}
          REPORT_R2_PUBLIC_BUCKET: ${{ vars.REPORT_R2_PUBLIC_BUCKET }}
          REPORT_PUBLIC_BASE_URL: ${{ vars.REPORT_PUBLIC_BASE_URL }}
        run: node scripts/hostedReportCi.mjs publish --prepared ../prepared-report

  approve:
    needs: [prepare, compare, publish]
    if: |
      always() &&
      needs.compare.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.prepare.outputs.should_fail_on_diff == 'true' &&
      (needs.publish.outputs.status == 'published' || needs.publish.outputs.status == 'noop') &&
      needs.compare.outputs.has_diff == 'true'
    environment: vrt-approval
    runs-on: ubuntu-latest
    steps:
      - name: VRT diffs approved
        run: echo "Visual regression diffs have been reviewed and approved"
