name: Maintain hosted report retention

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

concurrency:
  group: maintain-hosted-reports
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    environment: Preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout maintenance scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: yn1323/hosting-pages
          ref: main
          path: hosting-main
          token: ${{ secrets.HOSTING_PAGES_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/**
          sparse-checkout-cone-mode: false

      - name: Checkout hosted reports
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: yn1323/hosting-pages
          ref: yps-reports
          path: hosting-reports
          token: ${{ secrets.HOSTING_PAGES_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            yps-crispy-carnival/*/.report-meta.json
            yps-crispy-carnival-vrt/pr-*/.report-meta.json
          sparse-checkout-cone-mode: false

      - name: Prune expired reports with compare-and-swap
        id: prune
        env:
          GIT_ASKPASS: ${{ github.workspace }}/hosting-main/.github/scripts/git-askpass.sh
          GIT_AUTH_TOKEN: ${{ secrets.HOSTING_PAGES_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          LEGACY_DELETE_AFTER: '2026-09-06T00:00:00Z'
          SOURCE_REPOSITORY_TOKEN: ${{ github.token }}
        run: bash hosting-main/.github/scripts/maintain-yps-reports.sh hosting-reports

      - name: Request a Pages deployment
        if: steps.prune.outputs.changed == 'true'
        env:
          HOSTING_PAGES_TOKEN: ${{ secrets.HOSTING_PAGES_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOSTING_PAGES_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yn1323/hosting-pages/dispatches \
            --data '{"event_type":"yps-report-published","client_payload":{"source":"retention"}}'
