name: Setup
description: Setup

runs:
  using: "composite"
  steps:
    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
    - name: pnpm
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      run: pnpm i --frozen-lockfile
