interface:
  display_name: "Convex Performance Audit"
  short_description:
    "Audit Convex reads, OCC conflicts, limits, and capped-data correctness."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#EF4444"
  default_prompt:
    "Use $convex-performance-audit to audit this Convex app. Start with the strongest
    signal available, identify the problem class, and suggest the smallest
    high-impact fix before proposing bigger structural changes."

policy:
  allow_implicit_invocation: true
